<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#040914"/>
      <stop offset="0.52" stop-color="#08182a"/>
      <stop offset="1" stop-color="#120b18"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffb46c" stop-opacity="0.95"/>
      <stop offset="0.34" stop-color="#ee6b42" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b33b53" stop-opacity="0"/>
