<widget name="RingSlotCell" canvas="106x44">
  <style>
    .Btn_cell { width: 106px; height: 44px; position: relative; background-color: #0d2434; border: 1px solid #1c4560; }
    .Btn_cell:hover { background-color: #143650; }
    .CellFill { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; background-color: #22303c; border-radius: 6px; }
    .CellNum { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; font-size: 17px; color: #5a707f; text-align: center; line-height: 44px; text-shadow: 1px 1px 4px #00000099; }
  </style>
  <div class="Root">
    <button class="Btn_cell" data-name="Btn_cell">
      <div class="CellFill" data-name="CellFill"></div>
      <text class="CellNum" data-name="CellNum">1</text>
    </button>
  </div>
</widget>
