<widget name="SettleModal" canvas="1920x1080" data-script="gameplay/ui/SettleScript">
  <style>
    .Dim { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; background-color: #050d14d9; hit-test: block; }
    .SettlePanel { width: 640px; height: 560px; margin: 240px auto; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; background-color: #10202ef2; border-radius: 20px; border: 2px solid #2a4a5e; padding: 24px; }
    .SettleTitle { width: 560px; height: 64px; flex-shrink: 0; font-size: 40px; color: #43d17c; text-align: center; font-weight: bold; text-shadow: 1px 2px 6px #000000aa; }
    .SettleSub { width: 560px; height: 40px; flex-shrink: 0; font-size: 22px; color: #cfe3ee; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .SettleStats { width: 560px; height: 150px; flex-shrink: 0; font-size: 22px; color: #9fc4d8; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .Btn_settle { width: 320px; height: 62px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #ffae00; border-radius: 12px; }
    .Btn_settle:hover { background-color: #ffc233; }
    .Label_settle { width: 300px; height: 34px; font-size: 22px; color: #3d2600; text-align: center; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .Btn_settle_alt { width: 320px; height: 62px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #2a5a3a; border-radius: 12px; }
    .Btn_settle_alt:hover { background-color: #35704a; }
    .Label_settle_alt { width: 300px; height: 34px; font-size: 22px; color: #b8ffd8; text-align: center; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
  </style>
  <div class="Dim">
    <div class="SettlePanel">
      <text class="SettleTitle" data-name="SettleTitle">环网建成</text>
      <text class="SettleSub" data-name="SettleSub"></text>
      <text class="SettleStats" data-name="SettleStats"></text>
      <button class="Btn_settle" data-name="Btn_retry"><text class="Label_settle">重试本幕</text></button>
      <button class="Btn_settle_alt" data-name="Btn_sandbox"><text class="Label_settle_alt">进入沙盒续行</text></button>
      <button class="Btn_settle" data-name="Btn_restart"><text class="Label_settle">重新开始</text></button>
    </div>
  </div>
</widget>
