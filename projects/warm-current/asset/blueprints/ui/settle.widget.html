<widget name="SettleModal" canvas="1920x1080" data-script="gameplay/ui/SettleScript">
  <style>
    .Dim { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; background-color: #050d14d9; hit-test: block; }
    .SettlePanel { width: 640px; height: 560px; margin: 240px auto; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 16px; background-image: linear-gradient(165deg, #0e2030ee 0%, #081422e0 50%, #0a1c2ce6 100%); border: 1px solid #2a5f7a; padding: 24px; }
    .SettleTitle { width: 560px; height: 64px; flex-shrink: 0; font-size: 40px; color: #43d17c; text-align: center; font-weight: bold; letter-spacing: 2px; text-shadow: 1px 2px 6px #000000aa; }
    .SettleSub { width: 560px; height: 40px; flex-shrink: 0; font-size: 22px; color: #bfe8ff; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .SettleStats { width: 560px; height: 150px; flex-shrink: 0; font-size: 22px; color: #8fbcd4; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .Btn_settle { width: 320px; height: 62px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #2a2010; border: 1px solid #8a6a2a; }
    .Btn_settle:hover { background-color: #3a2c14; }
    .Label_settle { width: 300px; height: 34px; font-size: 22px; color: #ffd98a; text-align: center; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .Btn_settle_alt { width: 320px; height: 62px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0f2a1c; border: 1px solid #2a6e4a; }
    .Btn_settle_alt:hover { background-color: #16382a; }
    .Label_settle_alt { width: 300px; height: 34px; font-size: 22px; color: #7fe8a8; text-align: center; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
  </style>
  <div class="Dim">
    <div class="SettlePanel">
      <text class="SettleTitle" data-name="SettleTitle">环网建成</text>
      <text class="SettleSub" data-name="SettleSub"></text>
      <text class="SettleStats" data-name="SettleStats"></text>
      <button class="Btn_settle" data-name="Btn_retry"><text class="Label_settle">重试本幕</text></button>
      <button class="Btn_settle_alt" data-name="Btn_sandbox"><text class="Label_settle_alt">进入沙盒续行</text></button>
      <button class="Btn_settle" data-name="Btn_restart"><text class="Label_settle">重新开始</text></button>
    </div>
  </div>
</widget>
