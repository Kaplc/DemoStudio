    .BtnPrimary:active { opacity: 0.72; }

    .ItemLabel { width: 250px; height: 62px; position: absolute; left: 34px; top: 0px; font-size: 21px; letter-spacing: 4px; color: #f2ffff; line-height: 62px; text-shadow: 0px 2px 4px #00000099; }
    .ItemNum { width: 40px; height: 62px; position: absolute; right: 14px; top: 0px; font-size: 16px; color: #72effa; line-height: 62px; text-align: right; text-shadow: 0px 2px 4px #00000099; }
