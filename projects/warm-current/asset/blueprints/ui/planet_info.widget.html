<widget name="PlanetInfoPanel" canvas="1920x1080" data-script="gameplay/ui/PlanetInfoScript">
  <style>
    .Root { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; }
    .PanelRoot { width: 460px; height: 372px; position: absolute; left: 16px; top: 380px; display: flex; flex-direction: column; gap: 6px; }
    .InfoBody { width: 460px; height: 372px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 8px; background-color: #0e1a24e8; border-radius: 14px; padding: 12px 14px; hit-test: block; }
    .TitleRow { width: 430px; height: 44px; flex-shrink: 0; display: flex; flex-direction: row; align-items: center; justify-content: space-between; }
    .TitleText { width: 300px; height: 34px; flex-shrink: 0; font-size: 23px; color: #7fdcff; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .Btn_close { width: 110px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #31445c; border-radius: 8px; }
    .Btn_close:hover { background-color: #3d566f; }
    .Label_close { width: 100px; height: 28px; flex-shrink: 0; font-size: 17px; color: #cfe3ee; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .KindText { width: 430px; height: 28px; flex-shrink: 0; font-size: 18px; color: #9fc4d8; text-shadow: 1px 1px 4px #00000066; }
    .InfoText { width: 430px; height: 116px; flex-shrink: 0; font-size: 19px; line-height: 28px; color: #cfe3ee; text-shadow: 1px 1px 4px #00000066; }
    .RouteText { width: 430px; height: 56px; flex-shrink: 0; font-size: 18px; line-height: 26px; color: #ffe9a8; text-shadow: 1px 1px 4px #00000066; }
    .HintText { width: 430px; height: 48px; flex-shrink: 0; font-size: 16px; line-height: 22px; color: #6f8ba0; text-shadow: 1px 1px 4px #00000066; }
  </style>
  <div class="Root">
    <div class="PanelRoot" data-name="PanelRoot">
      <div class="InfoBody" data-name="InfoBody">
        <div class="TitleRow"><text class="TitleText" data-name="TitleText">星球</text><button class="Btn_close" data-name="Btn_panel_close"><text class="Label_close">✕ 关闭</text></button></div>
        <text class="KindText" data-name="KindText"></text>
        <text class="InfoText" data-name="InfoText"></text>
        <text class="RouteText" data-name="RouteText"></text>
        <text class="HintText" data-name="HintText"></text>
      </div>
    </div>
  </div>
</widget>
