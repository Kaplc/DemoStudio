<widget name="PlanetInfoPanel" canvas="1920x1080" data-script="gameplay/ui/PlanetInfoScript">
  <style>
    .Root { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; }
    .PanelRoot { width: 460px; height: 428px; position: absolute; left: 16px; top: 380px; display: flex; flex-direction: column; gap: 6px; }
    .InfoBody { width: 460px; height: 428px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 8px; background-image: linear-gradient(165deg, #0e2030ee 0%, #081422e0 50%, #0a1c2ce6 100%); border: 1px solid #2a5f7a; padding: 12px 14px; hit-test: block; }
    .TitleRow { width: 430px; height: 44px; flex-shrink: 0; display: flex; flex-direction: row; align-items: center; justify-content: space-between; }
    .TitleText { width: 300px; height: 34px; flex-shrink: 0; font-size: 23px; color: #4fd8ff; font-weight: bold; letter-spacing: 2px; text-shadow: 1px 1px 4px #00000066; }
    .TitleDivider { width: 430px; height: 2px; flex-shrink: 0; background-image: linear-gradient(90deg, #35c8f5 0%, #16405c 100%); border-radius: 1px; }
    .Btn_close { width: 110px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0d2434; border: 1px solid #2a5f7a; }
    .Btn_close:hover { background-color: #143650; }
    .Label_close { width: 100px; height: 28px; flex-shrink: 0; font-size: 17px; color: #9fd8ef; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .KindText { width: 430px; height: 28px; flex-shrink: 0; font-size: 18px; color: #8fbcd4; text-shadow: 1px 1px 4px #00000066; }
    .InfoText { width: 430px; height: 88px; flex-shrink: 0; font-size: 19px; line-height: 28px; color: #bfe8ff; text-shadow: 1px 1px 4px #00000066; }
    .RouteText { width: 430px; height: 56px; flex-shrink: 0; font-size: 18px; line-height: 26px; color: #ffe9a8; text-shadow: 1px 1px 4px #00000066; }
    .HintText { width: 430px; height: 48px; flex-shrink: 0; font-size: 16px; line-height: 22px; color: #6f8ba0; text-shadow: 1px 1px 4px #00000066; }
    .OrbitRow { width: 430px; height: 44px; flex-shrink: 0; display: flex; flex-direction: row; align-items: center; justify-content: space-between; }
    .Btn_orbit { width: 210px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0d2434; border: 1px solid #235066; }
    .Btn_orbit:hover { background-color: #143650; }
    .Label_orbit { width: 200px; height: 28px; flex-shrink: 0; font-size: 17px; color: #4fd8ff; text-align: center; text-shadow: 1px 1px 4px #00000066; }
  </style>
  <div class="Root">
    <div class="PanelRoot" data-name="PanelRoot">
      <div class="InfoBody" data-name="InfoBody">
        <div class="TitleRow"><text class="TitleText" data-name="TitleText">星球</text><button class="Btn_close" data-name="Btn_panel_close"><text class="Label_close">✕ 关闭</text></button></div>
        <div class="TitleDivider"></div>
        <text class="KindText" data-name="KindText"></text>
        <text class="InfoText" data-name="InfoText"></text>
        <text class="RouteText" data-name="RouteText"></text>
        <text class="HintText" data-name="HintText"></text>
        <div class="OrbitRow"><button class="Btn_orbit" data-name="Btn_orbit"><text class="Label_orbit">🛰 近地轨道建设</text></button></div>
      </div>
    </div>
  </div>
</widget>
