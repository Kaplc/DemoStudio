<widget name="ViewLoading" canvas="1920x1080">
  <style>
    .LoadingRoot { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; background-color: #04070cf0; hit-test: block; }
    .LoadingBox { width: 560px; height: 220px; margin: 430px auto; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 28px; }
    .LoadingTitle { width: 520px; height: 60px; font-size: 42px; color: #bfe8ff; text-align: center; font-weight: bold; letter-spacing: 12px; text-shadow: 1px 2px 4px #00000066; }
    .LoadingBar { width: 460px; height: 8px; background-color: #0a1826; border: 1px solid #16394e; }
    .LoadingBarFill { width: 140px; height: 8px; margin: 0px auto; background-image: linear-gradient(90deg, #1f8fc0 0%, #4fd8ff 100%); border-radius: 4px; }
  </style>
  <div class="LoadingRoot">
    <div class="LoadingBox">
      <text class="LoadingTitle">跃迁中</text>
      <div class="LoadingBar"><div class="LoadingBarFill"></div></div>
    </div>
  </div>
</widget>
