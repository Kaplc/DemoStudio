<widget name="ShipyardPanel" canvas="1920x1080" data-script="gameplay/ui/ShipyardPanelScript">
  <style>
    .Root { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; }
    .PanelRoot { width: 1400px; height: 700px; position: absolute; left: 260px; top: 190px; display: flex; flex-direction: column; gap: 8px; }
    .ShipyardBody { width: 1400px; height: 700px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 8px; background-image: linear-gradient(165deg, #0e2030ee 0%, #081422e0 50%, #0a1c2ce6 100%); border: 1px solid #2a5f7a; padding: 14px; hit-test: block; }
    .PanelTitleRow { width: 1372px; height: 44px; flex-shrink: 0; display: flex; flex-direction: row; align-items: center; justify-content: space-between; }
    .TitleText { width: 420px; height: 34px; flex-shrink: 0; font-size: 22px; color: #4fd8ff; font-weight: bold; letter-spacing: 2px; text-shadow: 1px 1px 4px #00000066; }
    .StatusText { width: 320px; height: 28px; flex-shrink: 0; font-size: 18px; color: #8fbcd4; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .Btn_yd_close { width: 120px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0d2434; border: 1px solid #2a5f7a; }
    .Btn_yd_close:hover { background-color: #143650; }
    .Label_yd_close { width: 110px; height: 28px; font-size: 18px; color: #9fd8ef; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .MainRow { width: 1372px; height: 464px; flex-shrink: 0; display: flex; flex-direction: row; gap: 10px; }
    .HullCol { width: 320px; height: 464px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; }
    .ModuleCol { width: 720px; height: 464px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; }
    .OrderCol { width: 322px; height: 464px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; }
    .StepTitle { height: 24px; flex-shrink: 0; font-size: 16px; color: #4fd8ff; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .HullTitle { width: 320px; }
    .ModuleTitle { width: 720px; }
    .OrderTitle { width: 322px; }
    .HullList { width: 320px; height: 434px; flex-shrink: 0; }
    .ModuleList { width: 720px; height: 434px; flex-shrink: 0; }
    .OrderText { width: 322px; height: 356px; flex-shrink: 0; font-size: 16px; color: #ffe9a8; text-shadow: 1px 1px 4px #00000066; }
    .BottomRow { width: 1372px; height: 148px; flex-shrink: 0; display: flex; flex-direction: row; gap: 10px; }
    .QueueCol { width: 1102px; height: 148px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; }
    .QueueTitle { width: 1102px; }
    .ShipCardList { width: 1102px; height: 118px; flex-shrink: 0; }
    .Btn_yd_build { width: 260px; height: 148px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0f2a1c; border: 1px solid #2a6e4a; }
    .Btn_yd_build:hover { background-color: #16382a; }
    .BtnLabel { width: 220px; height: 64px; flex-shrink: 0; font-size: 20px; color: #7fe8a8; text-align: center; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
  </style>
  <div class="Root">
    <div class="PanelRoot" data-name="PanelRoot">
      <div class="ShipyardBody" data-name="ShipyardBody">
        <div class="PanelTitleRow"><text class="TitleText" data-name="TitleText">船坞</text><text class="StatusText" data-name="StatusText"></text><button class="Btn_yd_close" data-name="Btn_yd_close"><text class="Label_yd_close">✕ 关闭</text></button></div>
        <div class="MainRow" data-name="MainRow">
          <div class="HullCol" data-name="HullCol">
            <text class="StepTitle HullTitle" data-name="HullTitle">① 选船型</text>
            <div class="HullList" data-name="HullList" data-comp="UILayout" data-props='{"mode":"vertical","spacingX":0,"spacingY":6,"autoLayout":true}'></div>
          </div>
          <div class="ModuleCol" data-name="ModuleCol">
            <text class="StepTitle ModuleTitle" data-name="ModuleTitle">② 本船插件（按船型配置表，可不配）</text>
            <div class="ModuleList" data-name="ModuleList" data-comp="UILayout" data-props='{"mode":"vertical","spacingX":0,"spacingY":6,"autoLayout":true}'></div>
          </div>
          <div class="OrderCol" data-name="OrderCol">
            <text class="StepTitle OrderTitle" data-name="OrderTitle">③ 入队</text>
            <text class="OrderText" data-name="OrderText"></text>
          </div>
        </div>
        <div class="BottomRow" data-name="BottomRow">
          <div class="QueueCol" data-name="QueueCol">
            <text class="StepTitle QueueTitle" data-name="QueueTitle">造船队列（队首建造中）</text>
            <div class="ShipCardList" data-name="ShipCardList" data-comp="UILayout" data-props='{"mode":"horizontal","wrap":true,"spacingX":6,"spacingY":6,"autoLayout":true}'></div>
          </div>
          <button class="Btn_yd_build" data-name="Btn_yd_build"><text class="BtnLabel" data-name="BtnLabel">造船</text></button>
        </div>
      </div>
    </div>
  </div>
</widget>
