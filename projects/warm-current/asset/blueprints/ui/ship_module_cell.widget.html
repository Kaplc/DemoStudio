<widget name="ShipModuleCell" canvas="720x64">
  <style>
    .Btn_cell { width: 720px; height: 64px; position: relative; display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 12px; padding: 0px 12px; background-color: #0d2434; border: 1px solid #1c4560; }
    .Btn_cell:checked { background-color: #3a5a2a; }
    .CellName { width: 140px; height: 40px; font-size: 15px; color: #bfe8ff; text-align: left; font-weight: bold; text-shadow: 1px 1px 4px #00000099; }
    .CellDesc { width: 440px; height: 40px; font-size: 14px; color: #4fd8ff; text-align: left; text-shadow: 1px 1px 4px #00000099; }
    .CellCost { width: 70px; height: 20px; font-size: 14px; color: #ffe9a8; text-align: right; text-shadow: 1px 1px 4px #00000099; }
  </style>
  <div class="Root">
    <button class="Btn_cell" data-name="Btn_cell">
      <text class="CellName" data-name="CellName"></text>
      <text class="CellDesc" data-name="CellDesc"></text>
      <text class="CellCost" data-name="CellCost"></text>
    </button>
  </div>
</widget>
