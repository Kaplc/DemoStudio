<widget name="StatsPanel" canvas="1920x1080" data-script="gameplay/ui/StatsPanelScript" active="false">
  <style>
    .Root { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; }
    .StatsCard { width: 560px; height: 640px; position: absolute; left: 680px; top: 210px; display: flex; flex-direction: column; gap: 4px; background-color: #0e1a24f2; border-radius: 14px; padding: 16px 16px; hit-test: block; }
    .TitleRow { width: 528px; height: 44px; flex-shrink: 0; display: flex; flex-direction: row; justify-content: space-between; align-items: center; }
    .StatsTitle { width: 380px; height: 34px; flex-shrink: 0; font-size: 24px; color: #7fdcff; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .Btn_close { width: 104px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #31445c; border-radius: 8px; }
    .Btn_close:hover { background-color: #3d566f; }
    .Label_close { width: 96px; height: 28px; flex-shrink: 0; font-size: 18px; color: #cfe3ee; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .SecHead { width: 528px; height: 28px; flex-shrink: 0; font-size: 20px; color: #9fc4d8; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .LedgerRow { width: 528px; height: 32px; flex-shrink: 0; display: flex; flex-direction: row; justify-content: space-between; align-items: center; }
    .LedgerKey { width: 268px; height: 30px; flex-shrink: 0; font-size: 19px; color: #9fc4d8; text-shadow: 1px 1px 4px #00000066; }
    .LedgerVal { width: 260px; height: 30px; flex-shrink: 0; font-size: 19px; color: #ffe9a8; text-align: right; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .ValIn { color: #b8ffd8; }
    .ValOut { color: #ffb3a0; }
  </style>
  <div class="StatsCard">
    <div class="TitleRow">
      <text class="StatsTitle">H3 收支统计（本局累计）</text>
      <button class="Btn_close" data-name="Btn_close"><text class="Label_close">✕ 关闭</text></button>
    </div>
    <text class="SecHead">── 收入 ──</text>
    <div class="LedgerRow"><text class="LedgerKey">航线卸货净收</text><text class="LedgerVal ValIn" data-name="Val_unload"></text></div>
    <div class="LedgerRow"><text class="LedgerKey">拆站返还</text><text class="LedgerVal ValIn" data-name="Val_refund"></text></div>
    <text class="SecHead">── 支出 ──</text>
    <div class="LedgerRow"><text class="LedgerKey">聚能环焚烧</text><text class="LedgerVal ValOut" data-name="Val_ring"></text></div>
    <div class="LedgerRow"><text class="LedgerKey">研究点计费</text><text class="LedgerVal ValOut" data-name="Val_research"></text></div>
    <div class="LedgerRow"><text class="LedgerKey">舰队维护费</text><text class="LedgerVal ValOut" data-name="Val_maint"></text></div>
    <div class="LedgerRow"><text class="LedgerKey">造船</text><text class="LedgerVal ValOut" data-name="Val_build"></text></div>
    <div class="LedgerRow"><text class="LedgerKey">冻毁船重建</text><text class="LedgerVal ValOut" data-name="Val_rebuild"></text></div>
    <div class="LedgerRow"><text class="LedgerKey">反向航线油耗</text><text class="LedgerVal ValOut" data-name="Val_rfuel"></text></div>
    <div class="LedgerRow"><text class="LedgerKey">建材折算（送站）</text><text class="LedgerVal ValOut" data-name="Val_mat"></text></div>
    <text class="SecHead">── 合计 ──</text>
    <div class="LedgerRow"><text class="LedgerKey">收入合计</text><text class="LedgerVal ValIn" data-name="Val_income"></text></div>
    <div class="LedgerRow"><text class="LedgerKey">支出合计</text><text class="LedgerVal ValOut" data-name="Val_expense"></text></div>
    <div class="LedgerRow"><text class="LedgerKey">净结余</text><text class="LedgerVal" data-name="Val_net"></text></div>
  </div>
</widget>
