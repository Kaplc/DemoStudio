<widget name="ShipHullCell" canvas="300x84">
  <style>
    .Btn_cell { width: 300px; height: 84px; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #0d2434; border: 1px solid #1c4560; }
    .Btn_cell:checked { background-color: #3a5a2a; }
    .CellName { width: 280px; height: 24px; font-size: 17px; color: #bfe8ff; text-align: center; font-weight: bold; text-shadow: 1px 1px 4px #00000099; }
    .CellDesc { width: 280px; height: 20px; font-size: 14px; color: #4fd8ff; text-align: center; text-shadow: 1px 1px 4px #00000099; }
    .CellCost { width: 280px; height: 18px; font-size: 14px; color: #ffe9a8; text-align: center; text-shadow: 1px 1px 4px #00000099; }
  </style>
  <div class="Root">
    <button class="Btn_cell" data-name="Btn_cell">
      <text class="CellName" data-name="CellName"></text>
      <text class="CellDesc" data-name="CellDesc"></text>
      <text class="CellCost" data-name="CellCost"></text>
    </button>
  </div>
</widget>
