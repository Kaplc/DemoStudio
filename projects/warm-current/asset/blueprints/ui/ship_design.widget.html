<widget name="ShipDesignPanel" canvas="1920x1080" data-script="gameplay/ui/ShipDesignScript">
  <style>
    .Root { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; }
    .PanelRoot { width: 1920px; height: 1080px; position: absolute; left: 0px; top: 0px; }
    .DesignBody { box-sizing: border-box; width: 1920px; height: 1080px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 10px; background-image: linear-gradient(165deg, #0e2030f2 0%, #081422e8 50%, #0a1c2cee 100%); border: 1px solid #2a5f7a; padding: 20px; hit-test: block; }
    .PanelTitleRow { width: 1880px; height: 48px; flex-shrink: 0; display: flex; flex-direction: row; align-items: center; justify-content: space-between; }
    .TitleText { width: 520px; height: 36px; flex-shrink: 0; font-size: 26px; color: #4fd8ff; font-weight: bold; letter-spacing: 2px; text-shadow: 1px 1px 4px #00000066; }
    .StatusText { width: 520px; height: 30px; flex-shrink: 0; font-size: 18px; color: #8fbcd4; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .Btn_dsn_close { box-sizing: border-box; width: 130px; height: 48px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0d2434; border: 1px solid #2a5f7a; }
    .Btn_dsn_close:hover { background-color: #143650; }
    .Label_dsn_close { width: 120px; height: 30px; font-size: 19px; color: #9fd8ef; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .MainRow { width: 1880px; height: 950px; flex-shrink: 0; display: flex; flex-direction: row; gap: 16px; }
    .PartsCol { width: 720px; height: 950px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
    .PartsTopRow { width: 720px; height: 388px; flex-shrink: 0; display: flex; flex-direction: row; gap: 12px; }
    .HullSub { width: 320px; height: 388px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
    .TplSub { width: 388px; height: 388px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; }
    .BenchCol { width: 560px; height: 950px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
    .CardCol { width: 560px; height: 950px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
    .StepTitle { height: 26px; flex-shrink: 0; font-size: 17px; color: #4fd8ff; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .HullTitle { width: 320px; }
    .ModuleTitle { width: 720px; }
    .TplTitle { width: 388px; }
    .HullList { width: 320px; height: 354px; flex-shrink: 0; }
    .ModuleList { width: 720px; height: 470px; flex-shrink: 0; }
    .BenchTitle { width: 300px; }
    .BenchTitleRow { width: 560px; height: 44px; flex-shrink: 0; display: flex; flex-direction: row; align-items: center; justify-content: space-between; }
    .Btn_dsn_payload { box-sizing: border-box; width: 180px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0d2434; border: 1px solid #2a5f7a; }
    .Btn_dsn_payload:hover { background-color: #143650; }
    .Label_dsn_payload { width: 168px; height: 26px; font-size: 16px; color: #9fd8ef; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .BenchFrame { width: 560px; height: 850px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; background-image: linear-gradient(180deg, #0a1826 0%, #0c2234 100%); border: 1px dashed #2a5f7a; padding: 10px; }
    .ShipNameText { width: 520px; height: 36px; flex-shrink: 0; margin-bottom: 12px; font-size: 24px; color: #ffe9a8; font-weight: bold; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .StackList { width: 530px; height: 780px; flex-shrink: 0; }
    .AddMenu { position: absolute; left: 60px; top: 400px; width: 440px; height: 260px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 12px; background-image: linear-gradient(170deg, #0c2234f5 0%, #0a1a2af5 100%); border: 1px solid #4fd8ff; z-order: 20; }
    .AddMenuTitle { width: 400px; height: 30px; flex-shrink: 0; font-size: 19px; color: #4fd8ff; font-weight: bold; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .Btn_add_part { box-sizing: border-box; width: 340px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0d2434; border: 1px solid #2a5f7a; }
    .Btn_add_part:hover { background-color: #143650; }
    .Btn_add_part:disabled { background-color: #141a1e; }
    .Label_add_part { width: 320px; height: 28px; font-size: 17px; color: #ffe9a8; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .CardTitle { width: 560px; }
    .TrialText { width: 560px; height: 200px; flex-shrink: 0; font-size: 16px; color: #7fdcff; text-shadow: 1px 1px 4px #00000066; }
    .Btn_dsn_recommend { box-sizing: border-box; width: 560px; height: 52px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0d2434; border: 1px solid #2a5f7a; }
    .Btn_dsn_recommend:hover { background-color: #143650; }
    .Label_dsn_recommend { width: 540px; height: 32px; font-size: 18px; color: #9fd8ef; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .OrderText { width: 560px; height: 110px; flex-shrink: 0; font-size: 17px; color: #ffe9a8; text-shadow: 1px 1px 4px #00000066; }
    .DockRow { width: 560px; height: 56px; flex-shrink: 0; display: flex; flex-direction: row; gap: 10px; }
    .Btn_dsn_order { box-sizing: border-box; width: 180px; height: 56px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0f2a1c; border: 1px solid #2a6e4a; }
    .Btn_dsn_order:hover { background-color: #16382a; }
    .Btn_dsn_order:disabled { background-color: #141a1e; }
    .Label_dsn_order { width: 168px; height: 32px; font-size: 15px; color: #7fe8a8; text-align: center; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .DockEmptyText { width: 560px; height: 56px; flex-shrink: 0; font-size: 17px; color: #6f8ba0; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .Btn_dsn_save { box-sizing: border-box; width: 388px; height: 52px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0d2434; border: 1px solid #2a5f7a; }
    .Btn_dsn_save:hover { background-color: #143650; }
    .Label_dsn_save { width: 374px; height: 30px; font-size: 17px; color: #9fd8ef; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .Btn_dsn_ddel { box-sizing: border-box; width: 388px; height: 46px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0d2434; border: 1px solid #2a5f7a; }
    .Btn_dsn_ddel:hover { background-color: #143650; }
    .Label_dsn_ddel { width: 374px; height: 28px; font-size: 16px; color: #9fd8ef; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .DesignList { width: 388px; height: 226px; flex-shrink: 0; }
    .BottomHint { width: 1880px; height: 26px; flex-shrink: 0; font-size: 15px; color: #6f8ba0; text-shadow: 1px 1px 4px #00000066; }
  </style>
  <div class="Root">
    <div class="PanelRoot" data-name="PanelRoot">
      <div class="DesignBody" data-name="DesignBody">
        <div class="PanelTitleRow"><text class="TitleText" data-name="TitleText">🚀 火箭设计工坊</text><text class="StatusText" data-name="StatusText"></text><button class="Btn_dsn_close" data-name="Btn_dsn_close"><text class="Label_dsn_close">✕ 关闭</text></button></div>
        <div class="MainRow" data-name="MainRow">
          <div class="PartsCol" data-name="PartsCol">
            <div class="PartsTopRow" data-name="PartsTopRow">
              <div class="HullSub" data-name="HullSub">
                <text class="StepTitle HullTitle" data-name="HullTitle">① 箭体（船型）</text>
              <div class="HullList" data-name="HullList" data-comp="UILayout" data-props='{"mode":"vertical","spacingX":0,"spacingY":6,"justify":"start","autoHeight":true,"autoLayout":true}'></div>
              </div>
              <div class="TplSub" data-name="TplSub">
                <text class="StepTitle TplTitle" data-name="TplTitle">设计模板（点击载入）</text>
                <button class="Btn_dsn_save" data-name="Btn_dsn_save"><text class="Label_dsn_save">💾 存当前方案为模板</text></button>
                <button class="Btn_dsn_ddel" data-name="Btn_dsn_ddel"><text class="Label_dsn_ddel">🗑 删除所选模板</text></button>
                <div class="DesignList" data-name="DesignList" data-comp="UILayout" data-props='{"mode":"vertical","spacingX":0,"spacingY":4,"justify":"start","autoHeight":true,"autoLayout":true}'></div>
              </div>
            </div>
            <text class="StepTitle ModuleTitle" data-name="ModuleTitle">② 部件选择（点击装配台部位）</text>
            <div class="ModuleList" data-name="ModuleList" data-comp="UILayout" data-props='{"mode":"vertical","spacingX":0,"spacingY":6,"justify":"start","autoHeight":true,"autoLayout":true}'></div>
          </div>
          <div class="BenchCol" data-name="BenchCol">
            <div class="BenchTitleRow" data-name="BenchTitleRow"><text class="StepTitle BenchTitle" data-name="BenchTitle">③ 装配台</text><button class="Btn_dsn_payload" data-name="Btn_dsn_payload"><text class="Label_dsn_payload">🧩 荷载设计</text></button></div>
            <div class="BenchFrame" data-name="BenchFrame">
              <text class="ShipNameText" data-name="ShipNameText"></text>
              <div class="StackList" data-name="StackList" data-comp="UILayout" data-props='{"mode":"vertical","spacingX":0,"spacingY":6,"justify":"end","autoHeight":true,"autoLayout":true}'></div>
              <div class="AddMenu" data-name="AddMenu">
                <text class="AddMenuTitle" data-name="AddMenuTitle">选择要加装的部位</text>
                <button class="Btn_add_part" data-name="Btn_add_payload"><text class="Label_add_part" data-name="Label_add_payload">荷载</text></button>
                <button class="Btn_add_part" data-name="Btn_add_fuel"><text class="Label_add_part" data-name="Label_add_fuel">燃料</text></button>
                <button class="Btn_add_part" data-name="Btn_add_engine"><text class="Label_add_part" data-name="Label_add_engine">引擎</text></button>
              </div>
            </div>
          </div>
          <div class="CardCol" data-name="CardCol">
            <text class="StepTitle CardTitle" data-name="CardTitle">④ 性能卡（试航预估 · 三星口径）</text>
            <text class="TrialText" data-name="TrialText"></text>
            <button class="Btn_dsn_recommend" data-name="Btn_dsn_recommend"><text class="Label_dsn_recommend">⚙ 一键推荐配置（能过关但非最优）</text></button>
            <text class="OrderText" data-name="OrderText"></text>
            <div class="DockRow" data-name="DockRow">
              <button class="Btn_dsn_order" data-name="DockOrderBtn_0"><text class="Label_dsn_order" data-name="DockOrderLabel_0"></text></button>
              <button class="Btn_dsn_order" data-name="DockOrderBtn_1"><text class="Label_dsn_order" data-name="DockOrderLabel_1"></text></button>
              <button class="Btn_dsn_order" data-name="DockOrderBtn_2"><text class="Label_dsn_order" data-name="DockOrderLabel_2"></text></button>
            </div>
            <text class="DockEmptyText" data-name="DockEmptyText"></text>
          </div>
        </div>
        <text class="BottomHint" data-name="BottomHint">提示：① 选箭体（型号）→ ③ 装配台从一枚「+ 添加模块」开始，像缺氧火箭一样从下往上自由堆（点 + → 弹出小面板选部位 → ② 区挑设计件；点已装行换装/卸下）；「荷载/燃料/引擎」部位装的是已保存的设计——去「荷载设计」等工坊合成；下水需先造船坞；设计模板随存档保存。</text>
      </div>
    </div>
  </div>
</widget>
