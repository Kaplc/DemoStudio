<widget name="ResearchPanel" canvas="1920x1080" data-script="gameplay/ui/ResearchPanelScript">
  <style>
    .Root { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; }
    .PanelRoot { width: 520px; height: 442px; position: absolute; left: 1386px; top: 574px; display: flex; flex-direction: column; gap: 10px; }
    .ResearchBody { width: 520px; height: 442px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 6px; background-color: #0e1a24e8; border-radius: 14px; padding: 12px 14px; hit-test: block; }
    .FleetText { width: 480px; height: 30px; flex-shrink: 0; font-size: 20px; color: #9fc4d8; text-shadow: 1px 1px 4px #00000066; }
    .LineRow { width: 490px; height: 48px; flex-shrink: 0; display: flex; flex-direction: row; align-items: center; }
    .LineText { width: 320px; height: 32px; flex-shrink: 0; font-size: 20px; color: #cfe3ee; text-shadow: 1px 1px 6px #00000099; }
    .Btn_oc { width: 150px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #31445c; border-radius: 8px; }
    .Btn_oc:hover { background-color: #3d566f; }
    .Label_oc { width: 140px; height: 28px; font-size: 18px; color: #ffd9a8; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .ShipRow { width: 490px; height: 48px; flex-shrink: 0; display: flex; flex-direction: row; align-items: center; justify-content: flex-end; gap: 10px; }
    .Btn_ship { width: 150px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #2a5a3a; border-radius: 8px; }
    .Btn_ship:hover { background-color: #35704a; }
    .Label_ship { width: 140px; height: 30px; font-size: 19px; color: #b8ffd8; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .PanelTitle { width: 250px; height: 34px; flex-shrink: 0; font-size: 22px; color: #7fdcff; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .PanelTitleRow { width: 490px; height: 44px; flex-shrink: 0; display: flex; flex-direction: row; align-items: center; justify-content: space-between; }
    .Btn_close_panel { width: 120px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #31445c; border-radius: 8px; }
    .Btn_close_panel:hover { background-color: #3d566f; }
    .Label_close_panel { width: 110px; height: 28px; font-size: 18px; color: #cfe3ee; text-align: center; text-shadow: 1px 1px 4px #00000066; }
  </style>
  <div class="Root">
    <div class="PanelRoot" data-name="PanelRoot">
      <div class="ResearchBody" data-name="ResearchBody">
        <div class="PanelTitleRow"><text class="PanelTitle">研究 · 船队</text><button class="Btn_close_panel" data-name="Btn_panel_close"><text class="Label_close_panel">✕ 关闭</text></button></div>
        <text class="FleetText" data-name="FleetText">船队 3（空闲 3 · 在途 0 · 冻毁 0）</text>
        <div class="LineRow"><text class="LineText" data-name="Line_engine">引擎线 0%</text><button class="Btn_oc" data-name="Btn_oc_engine"><text class="Label_oc">超频 +50%</text></button></div>
        <div class="LineRow"><text class="LineText" data-name="Line_cargo">货舱线 0%</text><button class="Btn_oc" data-name="Btn_oc_cargo"><text class="Label_oc">超频 +50%</text></button></div>
        <div class="LineRow"><text class="LineText" data-name="Line_ring">环线 0%</text><button class="Btn_oc" data-name="Btn_oc_ring"><text class="Label_oc">超频 +50%</text></button></div>
        <div class="LineRow"><text class="LineText" data-name="Line_infra">基建线 0%</text><button class="Btn_oc" data-name="Btn_oc_infra"><text class="Label_oc">超频 +50%</text></button></div>
        <div class="LineRow"><text class="LineText" data-name="Line_expand">扩张线 0%</text><button class="Btn_oc" data-name="Btn_oc_expand"><text class="Label_oc">超频 +50%</text></button></div>
        <div class="ShipRow">
          <button class="Btn_ship" data-name="Btn_ship"><text class="Label_ship">造船 150</text></button>
        </div>
      </div>
    </div>
  </div>
</widget>
