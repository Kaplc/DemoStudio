<widget name="ResearchPanel" canvas="1920x1080" data-script="gameplay/ui/ResearchPanelScript">
  <style>
    .Root { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; }
    .PanelRoot { width: 520px; height: 442px; position: absolute; left: 700px; top: 319px; display: flex; flex-direction: column; gap: 10px; }
    .ResearchBody { width: 520px; height: 442px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 6px; background-image: linear-gradient(165deg, #0e2030ee 0%, #081422e0 50%, #0a1c2ce6 100%); border: 1px solid #2a5f7a; padding: 12px 14px; hit-test: block; }
    .PanelTitleRow { width: 490px; height: 44px; flex-shrink: 0; display: flex; flex-direction: row; align-items: center; justify-content: space-between; }
    .PanelTitle { width: 250px; height: 34px; flex-shrink: 0; font-size: 22px; color: #4fd8ff; font-weight: bold; letter-spacing: 2px; text-shadow: 1px 1px 4px #00000066; }
    .TitleDivider { width: 490px; height: 2px; flex-shrink: 0; background-image: linear-gradient(90deg, #35c8f5 0%, #16405c 100%); border-radius: 1px; }
    .Btn_close_panel { width: 120px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0d2434; border: 1px solid #2a5f7a; }
    .Btn_close_panel:hover { background-color: #143650; }
    .Label_close_panel { width: 110px; height: 28px; font-size: 18px; color: #9fd8ef; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .PointsText { width: 490px; height: 28px; flex-shrink: 0; font-size: 19px; color: #ffe9a8; text-shadow: 1px 1px 4px #00000066; }
    .FleetText { width: 490px; height: 28px; flex-shrink: 0; font-size: 19px; color: #8fbcd4; text-shadow: 1px 1px 4px #00000066; }
    .LineRow { width: 490px; height: 44px; flex-shrink: 0; display: flex; flex-direction: row; align-items: center; gap: 6px; }
    .LineText { width: 196px; height: 30px; flex-shrink: 0; font-size: 20px; color: #bfe8ff; text-shadow: 1px 1px 6px #00000099; }
    .Btn_pt { width: 44px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0d2434; border: 1px solid #235066; }
    .Btn_pt:hover { background-color: #143650; }
    .Label_pt { width: 32px; height: 30px; font-size: 20px; color: #9fd8ef; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .PtsText { width: 52px; height: 30px; flex-shrink: 0; font-size: 19px; color: #ffe9a8; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .RateText { width: 100px; height: 30px; flex-shrink: 0; font-size: 17px; color: #8fbcd4; text-align: right; text-shadow: 1px 1px 4px #00000066; }
  </style>
  <div class="Root">
    <div class="PanelRoot" data-name="PanelRoot">
      <div class="ResearchBody" data-name="ResearchBody">
        <div class="PanelTitleRow"><text class="PanelTitle">研究 · 船队</text><button class="Btn_close_panel" data-name="Btn_panel_close"><text class="Label_close_panel">✕ 关闭</text></button></div>
        <div class="TitleDivider"></div>
        <text class="PointsText" data-name="PointsText">◆ 可用研究点 1 · 研究耗 0.0/s</text>
        <text class="FleetText" data-name="FleetText">船队 3（空闲 3 · 在途 0 · 冻毁 0）</text>
        <div class="LineRow"><text class="LineText" data-name="Line_engine">引擎线 0%</text><button class="Btn_pt" data-name="Btn_dec_engine"><text class="Label_pt">-</text></button><text class="PtsText" data-name="Pts_engine">0点</text><button class="Btn_pt" data-name="Btn_inc_engine"><text class="Label_pt">+</text></button><text class="RateText" data-name="Rate_engine">0.0/s</text></div>
        <div class="LineRow"><text class="LineText" data-name="Line_cargo">货舱线 0%</text><button class="Btn_pt" data-name="Btn_dec_cargo"><text class="Label_pt">-</text></button><text class="PtsText" data-name="Pts_cargo">0点</text><button class="Btn_pt" data-name="Btn_inc_cargo"><text class="Label_pt">+</text></button><text class="RateText" data-name="Rate_cargo">0.0/s</text></div>
        <div class="LineRow"><text class="LineText" data-name="Line_infra">基建线 0%</text><button class="Btn_pt" data-name="Btn_dec_infra"><text class="Label_pt">-</text></button><text class="PtsText" data-name="Pts_infra">0点</text><button class="Btn_pt" data-name="Btn_inc_infra"><text class="Label_pt">+</text></button><text class="RateText" data-name="Rate_infra">0.0/s</text></div>
        <div class="LineRow"><text class="LineText" data-name="Line_expand">扩张线 0%</text><button class="Btn_pt" data-name="Btn_dec_expand"><text class="Label_pt">-</text></button><text class="PtsText" data-name="Pts_expand">0点</text><button class="Btn_pt" data-name="Btn_inc_expand"><text class="Label_pt">+</text></button><text class="RateText" data-name="Rate_expand">0.0/s</text></div>
      </div>
    </div>
  </div>
</widget>
