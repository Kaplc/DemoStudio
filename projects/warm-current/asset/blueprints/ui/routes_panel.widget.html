<widget name="RoutesPanel" canvas="1920x1080" data-script="gameplay/ui/RoutesPanelScript">
  <style>
    .Root { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; }
    .PanelRoot { width: 640px; height: 500px; position: absolute; left: 1256px; top: 316px; display: flex; flex-direction: column; gap: 6px; }
    .RoutesBody { width: 640px; height: 500px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 6px; background-color: #0e1a24e8; border-radius: 14px; padding: 12px 14px; hit-test: block; }
    .PanelTitleRow { width: 610px; height: 44px; flex-shrink: 0; display: flex; flex-direction: row; align-items: center; justify-content: space-between; }
    .PanelTitle { width: 300px; height: 34px; flex-shrink: 0; font-size: 22px; color: #7fdcff; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .Btn_close_panel { width: 120px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #31445c; border-radius: 8px; }
    .Btn_close_panel:hover { background-color: #3d566f; }
    .Label_close_panel { width: 110px; height: 28px; font-size: 18px; color: #cfe3ee; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .FleetText { width: 610px; height: 30px; flex-shrink: 0; font-size: 20px; color: #9fc4d8; text-shadow: 1px 1px 4px #00000066; }
    .RouteRow { width: 610px; height: 48px; flex-shrink: 0; display: flex; flex-direction: row; align-items: center; gap: 8px; }
    .Btn_name { width: 160px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #16303f; border-radius: 8px; }
    .Btn_name:hover { background-color: #1d3a52; }
    .Label_name { width: 150px; height: 28px; font-size: 18px; color: #7fdcff; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .RouteInfo { width: 226px; height: 44px; flex-shrink: 0; font-size: 15px; line-height: 22px; color: #9fc4d8; text-shadow: 1px 1px 4px #00000066; }
    .Btn_add { width: 60px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #2a5a3a; border-radius: 8px; }
    .Btn_add:hover { background-color: #35704a; }
    .Btn_recall { width: 60px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #31445c; border-radius: 8px; }
    .Btn_recall:hover { background-color: #3d566f; }
    .Btn_del { width: 60px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #5c3131; border-radius: 8px; }
    .Btn_del:hover { background-color: #70403a; }
    .Label_btn { width: 52px; height: 28px; font-size: 17px; color: #cfe3ee; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .Label_add { width: 52px; height: 28px; font-size: 17px; color: #b8ffd8; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .Label_del { width: 52px; height: 28px; font-size: 17px; color: #ff9a8a; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .EmptyText { width: 610px; height: 40px; flex-shrink: 0; font-size: 17px; color: #6f8ba0; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .MoreText { width: 610px; height: 20px; flex-shrink: 0; font-size: 16px; color: #6a8496; text-shadow: 1px 1px 4px #00000066; }
  </style>
  <div class="Root">
    <div class="PanelRoot" data-name="PanelRoot">
      <div class="RoutesBody" data-name="RoutesBody">
        <div class="PanelTitleRow"><text class="PanelTitle">航线 · 管理</text><button class="Btn_close_panel" data-name="Btn_panel_close"><text class="Label_close_panel">✕ 关闭</text></button></div>
        <text class="FleetText" data-name="FleetText">船队 3（空闲 3 · 在途 0 · 冻毁 0）</text>
        <div class="RouteRow" data-name="RouteRow_0"><button class="Btn_name" data-name="Btn_name_0"><text class="Label_name" data-name="Label_name_0"></text></button><text class="RouteInfo" data-name="RouteInfo_0"></text><button class="Btn_add" data-name="Btn_add_0"><text class="Label_add">派船</text></button><button class="Btn_recall" data-name="Btn_recall_0"><text class="Label_btn">召回</text></button><button class="Btn_del" data-name="Btn_del_0"><text class="Label_del">删线</text></button></div>
        <div class="RouteRow" data-name="RouteRow_1"><button class="Btn_name" data-name="Btn_name_1"><text class="Label_name" data-name="Label_name_1"></text></button><text class="RouteInfo" data-name="RouteInfo_1"></text><button class="Btn_add" data-name="Btn_add_1"><text class="Label_add">派船</text></button><button class="Btn_recall" data-name="Btn_recall_1"><text class="Label_btn">召回</text></button><button class="Btn_del" data-name="Btn_del_1"><text class="Label_del">删线</text></button></div>
        <div class="RouteRow" data-name="RouteRow_2"><button class="Btn_name" data-name="Btn_name_2"><text class="Label_name" data-name="Label_name_2"></text></button><text class="RouteInfo" data-name="RouteInfo_2"></text><button class="Btn_add" data-name="Btn_add_2"><text class="Label_add">派船</text></button><button class="Btn_recall" data-name="Btn_recall_2"><text class="Label_btn">召回</text></button><button class="Btn_del" data-name="Btn_del_2"><text class="Label_del">删线</text></button></div>
        <div class="RouteRow" data-name="RouteRow_3"><button class="Btn_name" data-name="Btn_name_3"><text class="Label_name" data-name="Label_name_3"></text></button><text class="RouteInfo" data-name="RouteInfo_3"></text><button class="Btn_add" data-name="Btn_add_3"><text class="Label_add">派船</text></button><button class="Btn_recall" data-name="Btn_recall_3"><text class="Label_btn">召回</text></button><button class="Btn_del" data-name="Btn_del_3"><text class="Label_del">删线</text></button></div>
        <div class="RouteRow" data-name="RouteRow_4"><button class="Btn_name" data-name="Btn_name_4"><text class="Label_name" data-name="Label_name_4"></text></button><text class="RouteInfo" data-name="RouteInfo_4"></text><button class="Btn_add" data-name="Btn_add_4"><text class="Label_add">派船</text></button><button class="Btn_recall" data-name="Btn_recall_4"><text class="Label_btn">召回</text></button><button class="Btn_del" data-name="Btn_del_4"><text class="Label_del">删线</text></button></div>
        <div class="RouteRow" data-name="RouteRow_5"><button class="Btn_name" data-name="Btn_name_5"><text class="Label_name" data-name="Label_name_5"></text></button><text class="RouteInfo" data-name="RouteInfo_5"></text><button class="Btn_add" data-name="Btn_add_5"><text class="Label_add">派船</text></button><button class="Btn_recall" data-name="Btn_recall_5"><text class="Label_btn">召回</text></button><button class="Btn_del" data-name="Btn_del_5"><text class="Label_del">删线</text></button></div>
        <text class="EmptyText" data-name="EmptyText">尚无航线 —— 回星图从星球拖线到地球即可建立</text>
        <text class="MoreText" data-name="MoreText"></text>
      </div>
    </div>
  </div>
</widget>
