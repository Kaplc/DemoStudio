<widget name="BuildPanel" canvas="1920x1080" data-script="gameplay/ui/BuildPanelScript">
  <style>
    .Root { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; }
    .PanelRoot { width: 640px; height: 420px; position: absolute; left: 640px; top: 330px; display: flex; flex-direction: column; gap: 8px; }
    .BuildBody { width: 640px; height: 420px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: flex-start; align-items: flex-start; gap: 8px; background-color: #0e1a24e8; border-radius: 14px; padding: 12px 14px; hit-test: block; }
    .PanelTitleRow { width: 610px; height: 44px; flex-shrink: 0; display: flex; flex-direction: row; align-items: center; justify-content: space-between; }
    .PanelTitle { width: 300px; height: 34px; flex-shrink: 0; font-size: 22px; color: #7fdcff; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .Btn_close_panel { width: 120px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #31445c; border-radius: 8px; }
    .Btn_close_panel:hover { background-color: #3d566f; }
    .Label_close_panel { width: 110px; height: 28px; font-size: 18px; color: #cfe3ee; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .HintText { width: 610px; height: 24px; flex-shrink: 0; font-size: 16px; color: #8fb2c6; text-shadow: 1px 1px 4px #00000066; }
    .BuildRow { width: 610px; height: 56px; flex-shrink: 0; display: flex; flex-direction: row; align-items: center; gap: 8px; }
    .RowInfo { width: 424px; height: 52px; flex-shrink: 0; font-size: 17px; line-height: 24px; color: #cfe3ee; text-shadow: 1px 1px 6px #00000099; }
    .Btn_place { width: 92px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #2a5a3a; border-radius: 8px; }
    .Btn_place:hover { background-color: #35704a; }
    .Label_place { width: 82px; height: 28px; font-size: 18px; color: #b8ffd8; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .ModeText { width: 610px; height: 24px; flex-shrink: 0; font-size: 16px; color: #ffb03d; text-align: center; text-shadow: 1px 1px 4px #00000066; }
  </style>
  <div class="Root">
    <div class="PanelRoot" data-name="PanelRoot">
      <div class="BuildBody" data-name="BuildBody">
        <div class="PanelTitleRow"><text class="PanelTitle">建造 · 建筑</text><button class="Btn_close_panel" data-name="Btn_panel_close"><text class="Label_close_panel">✕ 关闭</text></button></div>
        <text class="HintText" data-name="HintText">选型后进入放置模式：星图吸附网格 · 点击落位 · Esc 取消</text>
        <div class="BuildRow" data-name="BuildRow_0"><text class="RowInfo" data-name="RowInfo_0"></text><button class="Btn_place" data-name="Btn_place_0"><text class="Label_place">放置</text></button></div>
        <div class="BuildRow" data-name="BuildRow_1"><text class="RowInfo" data-name="RowInfo_1"></text><button class="Btn_place" data-name="Btn_place_1"><text class="Label_place">放置</text></button></div>
        <div class="BuildRow" data-name="BuildRow_2"><text class="RowInfo" data-name="RowInfo_2"></text><button class="Btn_place" data-name="Btn_place_2"><text class="Label_place">放置</text></button></div>
        <div class="BuildRow" data-name="BuildRow_3"><text class="RowInfo" data-name="RowInfo_3"></text><button class="Btn_place" data-name="Btn_place_3"><text class="Label_place">放置</text></button></div>
        <text class="ModeText" data-name="ModeText"></text>
      </div>
    </div>
  </div>
</widget>
