<widget name="FleetOrderBar" canvas="1920x1080" data-script="gameplay/ui/FleetOrderBarScript">
  <style>
    .Root { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; pointer-events: none; }
    .Bar { width: 640px; height: 64px; position: absolute; left: 640px; top: 1000px; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 8px; background-color: #0e1a24f0; border-radius: 14px; padding: 8px 12px; hit-test: block; }
    .SelText { width: 170px; height: 40px; flex-shrink: 0; font-size: 16px; color: #ffe9a8; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .Btn_order { width: 118px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #1d3a52; border-radius: 8px; }
    .Btn_order:hover { background-color: #27506e; }
    .Label_order { width: 106px; height: 26px; font-size: 16px; color: #7fdcff; text-align: center; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .Btn_order_clear { width: 90px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #31445c; border-radius: 8px; }
    .Btn_order_clear:hover { background-color: #3d566f; }
    .Label_clear { width: 80px; height: 26px; font-size: 16px; color: #cfe3ee; text-align: center; text-shadow: 1px 1px 4px #00000066; }
  </style>
  <div class="Root">
    <div class="Bar" data-name="Bar">
      <text class="SelText" data-name="SelText">已选 0 艘</text>
      <button class="Btn_order" data-name="Btn_order_run"><text class="Label_order" data-name="Label_run">照跑</text></button>
      <button class="Btn_order" data-name="Btn_order_shelter"><text class="Label_order" data-name="Label_shelter">就近靠站</text></button>
      <button class="Btn_order" data-name="Btn_order_hold"><text class="Label_order" data-name="Label_hold">原地待命</text></button>
      <button class="Btn_order_clear" data-name="Btn_order_clear"><text class="Label_clear" data-name="Label_clear">取消选择</text></button>
    </div>
  </div>
</widget>
