<widget name="WarmCurrentHud" canvas="1920x1080" data-script="gameplay/ui/HudScript">
  <style>
    .Root { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; }
    .TopBar { width: 1824px; height: 60px; position: absolute; left: 48px; top: 12px; display: flex; flex-direction: row; align-items: center; gap: 14px; background-image: linear-gradient(165deg, #0e2030ee 0%, #081422e0 50%, #0a1c2ce6 100%); border: 1px solid #2a5f7a; padding: 0px 18px; hit-test: block; }
    .TimeText { width: 100px; height: 30px; flex-shrink: 0; font-size: 22px; color: #bfe8ff; text-shadow: 1px 1px 4px #00000066; }
    .ReserveChip { width: 190px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-image: linear-gradient(180deg, #0b1e30 0%, #071120 100%); border: 1px solid #1c4560; }
    .ReserveText { width: 174px; height: 30px; flex-shrink: 0; font-size: 23px; color: #ffe9a8; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .Btn_ctrl { width: 96px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0d2434; border: 1px solid #235066; }
    .Btn_ctrl:hover { background-color: #143650; }
    .Btn_restart { width: 96px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #2a2010; border: 1px solid #8a6a2a; }
    .Btn_restart:hover { background-color: #3a2c14; }
    .Label_ctrl { width: 84px; height: 30px; flex-shrink: 0; font-size: 20px; color: #9fd8ef; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .Divider { width: 2px; height: 30px; flex-shrink: 0; background-color: #235066; }
    .Btn_info { width: 140px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0d2434; border: 1px solid #235066; }
    .Btn_info:hover { background-color: #143650; }
    .Label_info { width: 128px; height: 30px; flex-shrink: 0; font-size: 19px; color: #ffe9a8; text-align: center; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .Space { width: 2px; height: 30px; flex-shrink: 0; }
    .EventBanner { width: 620px; height: 46px; position: absolute; left: 650px; top: 84px; font-size: 26px; color: #ffb03d; text-align: center; font-weight: bold; text-shadow: 1px 2px 5px #000000cc; }
    .MissionBtn { width: 400px; height: 68px; position: absolute; left: 1504px; top: 900px; display: flex; justify-content: center; align-items: center; background-color: #2a2010; border: 1px solid #8a6a2a; }
    .MissionBtn:hover { background-color: #3a2c14; }
    .Label_mission { width: 380px; height: 34px; font-size: 22px; color: #ffd98a; text-align: center; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .BottomBar { width: 1220px; height: 60px; position: absolute; left: 425px; top: 1000px; display: flex; flex-direction: row; align-items: center; gap: 12px; background-image: linear-gradient(165deg, #0e2030ee 0%, #081422e0 50%, #0a1c2ce6 100%); border: 1px solid #2a5f7a; padding: 0px 16px; hit-test: block; }
    .Btn_bar { width: 130px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0d2434; border: 1px solid #235066; }
    .Btn_bar:hover { background-color: #143650; }
    .Btn_bar:active { background-color: #1a5a80; }
    .Label_bar { width: 118px; height: 30px; flex-shrink: 0; font-size: 20px; color: #4fd8ff; text-align: center; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .Btn_research { width: 180px; height: 44px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0d2434; border: 1px solid #235066; }
    .Btn_research:hover { background-color: #143650; }
    .Btn_research:active { background-color: #1a5a80; }
    .Label_research { width: 168px; height: 30px; flex-shrink: 0; font-size: 20px; color: #4fd8ff; text-align: center; font-weight: bold; text-shadow: 1px 1px 4px #00000066; }
    .ResearchBadge { width: 280px; height: 30px; flex-shrink: 0; font-size: 18px; color: #8fbcd4; text-shadow: 1px 1px 4px #00000066; }
    .SelPanel { width: 500px; height: 250px; position: absolute; left: 16px; top: 814px; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 8px; background-image: linear-gradient(165deg, #0e2030ee 0%, #081422e0 50%, #0a1c2ce6 100%); border: 1px solid #2a5f7a; padding: 12px 14px; }
    .SelText { width: 468px; height: 120px; flex-shrink: 0; font-size: 21px; color: #bfe8ff; text-shadow: 1px 1px 4px #00000066; }
    .SelBtnRow1 { width: 468px; height: 48px; flex-shrink: 0; display: flex; flex-direction: row; gap: 10px; }
    .Btn_sel { width: 226px; height: 46px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; background-color: #0d2434; border: 1px solid #235066; }
    .Btn_sel:hover { background-color: #143650; }
    .Label_sel { width: 214px; height: 30px; flex-shrink: 0; font-size: 19px; color: #4fd8ff; text-align: center; text-shadow: 1px 1px 4px #00000066; }
    .ToastBox { width: 980px; height: 210px; position: absolute; left: 470px; top: 854px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
    .Toast { width: 980px; height: 42px; flex-shrink: 0; font-size: 22px; color: #bfe8ff; text-align: center; text-shadow: 1px 2px 4px #000000cc; }
    .TutText { width: 1100px; height: 56px; position: absolute; left: 410px; top: 770px; font-size: 26px; color: #ffb03d; text-align: center; font-weight: bold; text-shadow: 1px 2px 5px #000000cc; }
  </style>
  <div class="Root">
    <div class="TopBar" data-name="TopBar">
      <text class="TimeText" data-name="TimeText">0:00</text>
      <div class="ReserveChip">
        <text class="ReserveText" data-name="ReserveText">储量 1000 t</text>
      </div>
      <div class="Divider"></div>
      <button class="Btn_ctrl" data-name="Btn_pause"><text class="Label_ctrl" data-name="Label_pause">暂停</text></button>
      <button class="Btn_ctrl" data-name="Btn_speed"><text class="Label_ctrl" data-name="Label_speed">倍速 x1</text></button>
      <button class="Btn_restart" data-name="Btn_restart"><text class="Label_ctrl" data-name="Label_restart">重开</text></button>
      <div class="Space"></div>
      <button class="Btn_info" data-name="Btn_info"><text class="Label_info">📦 储量详情</text></button>
      <button class="Btn_info" data-name="Btn_stats"><text class="Label_info">📊 收支统计</text></button>
    </div>
    <text class="EventBanner" data-name="EventText"></text>
    <button class="MissionBtn" data-name="Btn_mission"><text class="Label_mission">发射火星模块运输</text></button>
    <div class="BottomBar" data-name="BottomBar">
      <button class="Btn_bar" data-name="Btn_build"><text class="Label_bar">建造</text></button>
      <button class="Btn_bar" data-name="Btn_transport"><text class="Label_bar">运输</text></button>
      <button class="Btn_bar" data-name="Btn_routes"><text class="Label_bar">航线</text></button>
      <button class="Btn_bar" data-name="Btn_routeedit"><text class="Label_bar" data-name="Label_routeedit">航线编辑</text></button>
      <button class="Btn_research" data-name="Btn_research"><text class="Label_research" data-name="Label_research">☰ 科研</text></button>
      <button class="Btn_bar" data-name="Btn_ring"><text class="Label_bar">聚能环</text></button>
      <text class="ResearchBadge" data-name="ResearchBadge"></text>
    </div>
    <div class="SelPanel" data-name="SelPanel">
      <text class="SelText" data-name="SelText"></text>
      <div class="SelBtnRow1">
        <button class="Btn_sel" data-name="Btn_demolish"><text class="Label_sel">拆除返还 50%</text></button>
      </div>
    </div>
    <div class="ToastBox">
      <text class="Toast" data-name="Toast_0"></text>
      <text class="Toast" data-name="Toast_1"></text>
      <text class="Toast" data-name="Toast_2"></text>
      <text class="Toast" data-name="Toast_3"></text>
    </div>
    <text class="TutText" data-name="TutText">点底部「航线编辑」进入后，把「月球」拖到「地球」建立第一条氦-3 航线</text>
  </div>
</widget>
