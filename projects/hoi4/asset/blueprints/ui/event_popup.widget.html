<widget name="EventPopup" canvas="1920x1080" active="false" data-script="gameplay/ui/EventPopup">
  <style>
    .Dim { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; background-color: #0b1018b8; }
    .Panel { width: 760px; height: 520px; margin: 220px auto; display: flex; flex-direction: column; align-items: center; background-color: #1d2733; border: 3px solid #e0a83c; border-radius: 18px; hit-test: block; }
    .Title { width: 680px; height: 60px; margin-top: 30px; font-size: 30px; color: #e0a83c; text-align: center; font-weight: bold; }
    .Desc { width: 680px; height: 200px; margin-top: 16px; font-size: 20px; color: #cfd8e3; text-align: left; }
    .Btn_opt { width: 620px; height: 70px; margin-top: 14px; display: flex; justify-content: center; align-items: center; background-color: #31445c; border-radius: 12px; }
    .Btn_opt:hover { background-color: #3d566f; }
    .Label_opt { width: 580px; height: 32px; font-size: 20px; color: #e8eef5; text-align: center; }
  </style>
  <div class="Dim"></div>
  <div class="Panel">
    <text class="Title" data-name="Title"></text>
    <text class="Desc" data-name="Desc"></text>
    <button class="Btn_opt" data-name="Btn_opt0"><text class="Label_opt" data-name="Label_opt0"></text></button>
    <button class="Btn_opt" data-name="Btn_opt1"><text class="Label_opt" data-name="Label_opt1"></text></button>
  </div>
</widget>
