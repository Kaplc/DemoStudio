<widget name="LawRow" canvas="340x64">
  <style>
    .Root { width: 340px; height: 64px; display: flex; flex-direction: row; align-items: center; background-color: #2c3b4c; border-radius: 8px; }
    .NameText { width: 140px; height: 30px; margin-left: 12px; font-size: 17px; color: #e8eef5; text-align: left; }
    .InfoText { width: 90px; height: 26px; margin-left: 4px; font-size: 14px; color: #8fa3b8; text-align: left; }
    .Btn_switch { width: 70px; height: 42px; margin-left: auto; margin-right: 10px; display: flex; justify-content: center; align-items: center; background-color: #31445c; border-radius: 8px; }
    .Btn_switch:hover { background-color: #3d566f; }
    .Label_switch { width: 54px; height: 24px; font-size: 14px; color: #cfd8e3; text-align: center; }
  </style>
  <div class="Root">
    <text class="NameText" data-name="NameText"></text>
    <text class="InfoText" data-name="InfoText"></text>
    <button class="Btn_switch" data-name="Btn_switch"><text class="Label_switch" data-name="Label_switch">切换</text></button>
  </div>
</widget>
