<widget name="DiplomacyPanel" canvas="1920x1080" active="false" data-script="gameplay/ui/DiplomacyPanel">
  <style>
    .Dim { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; background-color: #0b1018c0; }
    .Panel { width: 1100px; height: 880px; margin: 60px auto; display: flex; flex-direction: column; align-items: center; background-color: #1d2733; border: 2px solid #3a4a5c; border-radius: 18px; hit-test: block; }
    .Head { width: 1040px; height: 60px; margin-top: 20px; display: flex; flex-direction: row; align-items: center; }
    .Title { width: 500px; height: 48px; font-size: 30px; color: #e0a83c; text-align: left; font-weight: bold; }
    .Btn_close { width: 120px; height: 48px; margin-left: auto; display: flex; justify-content: center; align-items: center; background-color: #7a3a38; border-radius: 10px; }
    .Btn_close:hover { background-color: #964644; }
    .Label_close { width: 90px; height: 30px; font-size: 19px; color: #ffe4e0; text-align: center; }
    .Hint { width: 1040px; height: 36px; margin-top: 6px; font-size: 18px; color: #8fa3b8; text-align: left; }
    .List { width: 1040px; height: 700px; margin-top: 10px; }
  </style>
  <div class="Dim"></div>
  <div class="Panel">
    <div class="Head">
      <text class="Title">外交</text>
      <button class="Btn_close" data-name="Btn_close"><text class="Label_close">关闭</text></button>
    </div>
    <text class="Hint">制造借口需 30 天（战争宣传国策减半）；有战争目标即可宣战。停战/吞并在对方失去全部胜利点后自动结算。</text>
    <div class="List" data-name="CountryList" data-comp="UILayout" data-props='{"mode":"vertical","spacingY":8,"autoLayout":true}'></div>
  </div>
</widget>
