<widget name="TopBar" canvas="1920x1080" data-script="gameplay/ui/TopBar">
  <style>
    .Root { width: 1920px; height: 80px; position: absolute; left: 0px; top: 0px; display: flex; flex-direction: row; align-items: center; background-color: #17222ee6; border-bottom: 2px solid #3a4a5c; }
    .DateBox { width: 250px; height: 56px; margin-left: 16px; display: flex; flex-direction: row; align-items: center; background-color: #1d2733; border-radius: 10px; }
    .DateText { width: 160px; height: 40px; margin-left: 12px; font-size: 22px; color: #e8eef5; text-align: left; }
    .Btn_pause { width: 60px; height: 44px; margin-left: 8px; display: flex; justify-content: center; align-items: center; background-color: #8a5a2a; border-radius: 8px; }
    .Btn_pause:hover { background-color: #a86e34; }
    .Label_pause { width: 44px; height: 32px; font-size: 22px; color: #ffe6c0; text-align: center; }
    .Btn_speed { width: 44px; height: 44px; margin-left: 6px; display: flex; justify-content: center; align-items: center; background-color: #31445c; border-radius: 8px; }
    .Btn_speed:hover { background-color: #3d566f; }
    .Label_speed { width: 30px; height: 30px; font-size: 20px; color: #cfd8e3; text-align: center; }
    .ResBox { width: 730px; height: 56px; margin-left: 18px; display: flex; flex-direction: row; align-items: center; background-color: #1d2733; border-radius: 10px; }
    .ResItem { width: 176px; height: 40px; margin-left: 10px; display: flex; flex-direction: row; align-items: center; }
    .ResLabel { width: 62px; height: 32px; font-size: 18px; color: #8fa3b8; text-align: right; }
    .ResValue { width: 104px; height: 32px; margin-left: 8px; font-size: 20px; color: #e8eef5; text-align: left; }
    .MenuBox { width: 850px; height: 56px; margin-left: 18px; display: flex; flex-direction: row; align-items: center; }
    .Btn_menu { width: 80px; height: 44px; margin-left: 6px; display: flex; justify-content: center; align-items: center; background-color: #31445c; border-radius: 8px; }
    .Btn_menu:hover { background-color: #3d566f; }
    .Label_menu { width: 72px; height: 30px; font-size: 18px; color: #cfd8e3; text-align: center; }
  </style>
  <div class="Root">
    <div class="DateBox">
      <text class="DateText" data-name="DateText"></text>
      <button class="Btn_pause" data-name="Btn_pause"><text class="Label_pause">II</text></button>
      <button class="Btn_speed" data-name="Btn_speed1"><text class="Label_speed">1</text></button>
      <button class="Btn_speed" data-name="Btn_speed2"><text class="Label_speed">2</text></button>
      <button class="Btn_speed" data-name="Btn_speed3"><text class="Label_speed">3</text></button>
      <button class="Btn_speed" data-name="Btn_speed4"><text class="Label_speed">4</text></button>
      <button class="Btn_speed" data-name="Btn_speed5"><text class="Label_speed">5</text></button>
    </div>
    <div class="ResBox">
      <div class="ResItem"><text class="ResLabel">政治点</text><text class="ResValue" data-name="PpText"></text></div>
      <div class="ResItem"><text class="ResLabel">人力</text><text class="ResValue" data-name="MpText"></text></div>
      <div class="ResItem"><text class="ResLabel">民厂</text><text class="ResValue" data-name="CivText"></text></div>
      <div class="ResItem"><text class="ResLabel">军厂</text><text class="ResValue" data-name="MilText"></text></div>
      <div class="ResItem"><text class="ResLabel">稳定</text><text class="ResValue" data-name="StabText"></text></div>
      <div class="ResItem"><text class="ResLabel">战争支持</text><text class="ResValue" data-name="WsText"></text></div>
      <div class="ResItem"><text class="ResLabel">钢</text><text class="ResValue" data-name="SteelText"></text></div>
      <div class="ResItem"><text class="ResLabel">油</text><text class="ResValue" data-name="OilText"></text></div>
    </div>
    <div class="MenuBox">
      <button class="Btn_menu" data-name="Btn_construction"><text class="Label_menu">建造</text></button>
      <button class="Btn_menu" data-name="Btn_production"><text class="Label_menu">生产</text></button>
      <button class="Btn_menu" data-name="Btn_research"><text class="Label_menu">科研</text></button>
      <button class="Btn_menu" data-name="Btn_focus"><text class="Label_menu">国策</text></button>
      <button class="Btn_menu" data-name="Btn_diplomacy"><text class="Label_menu">外交</text></button>
      <button class="Btn_menu" data-name="Btn_recruit"><text class="Label_menu">征兵</text></button>
      <button class="Btn_menu" data-name="Btn_laws"><text class="Label_menu">法律</text></button>
      <button class="Btn_menu" data-name="Btn_designer"><text class="Label_menu">编制</text></button>
      <button class="Btn_menu" data-name="Btn_mapmode"><text class="Label_menu">地形图</text></button>
      <button class="Btn_menu" data-name="Btn_save"><text class="Label_menu">存档</text></button>
    </div>
  </div>
</widget>
