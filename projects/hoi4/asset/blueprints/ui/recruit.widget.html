<widget name="RecruitPanel" canvas="1920x1080" active="false" data-script="gameplay/ui/RecruitPanel">
  <style>
    .Dim { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; background-color: #0b1018c0; }
    .Panel { width: 1100px; height: 880px; margin: 60px auto; display: flex; flex-direction: column; align-items: center; background-color: #1d2733; border: 2px solid #3a4a5c; border-radius: 18px; hit-test: block; }
    .Head { width: 1040px; height: 60px; margin-top: 20px; display: flex; flex-direction: row; align-items: center; }
    .Title { width: 500px; height: 48px; font-size: 30px; color: #e0a83c; text-align: left; font-weight: bold; }
    .Btn_close { width: 120px; height: 48px; margin-left: auto; display: flex; justify-content: center; align-items: center; background-color: #7a3a38; border-radius: 10px; }
    .Btn_close:hover { background-color: #964644; }
    .Label_close { width: 90px; height: 30px; font-size: 19px; color: #ffe4e0; text-align: center; }
    .MpText { width: 1040px; height: 36px; margin-top: 8px; font-size: 19px; color: #8fa3b8; text-align: left; }
    .SecTitle { width: 1040px; height: 38px; margin-top: 12px; font-size: 20px; color: #8fa3b8; text-align: left; }
    .TplBox { width: 1040px; height: 300px; display: flex; flex-direction: row; flex-wrap: wrap; align-content: flex-start; }
    .Btn_tpl { width: 320px; height: 96px; margin-left: 14px; margin-top: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #31445c; border-radius: 12px; }
    .Btn_tpl:hover { background-color: #3d566f; }
    .Label_tpl { width: 280px; height: 32px; font-size: 19px; color: #cfd8e3; text-align: center; }
    .SubLabel { width: 280px; height: 26px; font-size: 15px; color: #8fa3b8; text-align: center; }
    .QueueList { width: 1040px; height: 320px; margin-top: 6px; }
    .DeployBox { width: 1040px; height: 90px; margin-top: 14px; display: flex; flex-direction: row; align-items: center; background-color: #24313f; border-radius: 12px; }
    .DeployText { width: 400px; height: 36px; margin-left: 20px; font-size: 19px; color: #cfd8e3; text-align: left; }
    .Btn_deploy { width: 320px; height: 60px; margin-left: auto; margin-right: 20px; display: flex; justify-content: center; align-items: center; background-color: #6a7c34; border-radius: 10px; }
    .Btn_deploy:hover { background-color: #7f9440; }
    .Label_deploy { width: 280px; height: 30px; font-size: 19px; color: #f2f7e6; text-align: center; }
  </style>
  <div class="Dim"></div>
  <div class="Panel">
    <div class="Head">
      <text class="Title">征兵与部署</text>
      <button class="Btn_close" data-name="Btn_close"><text class="Label_close">关闭</text></button>
    </div>
    <text class="MpText" data-name="MpText"></text>
    <text class="SecTitle">可训练编制（点击排入训练队列；装备/人力在排入时预扣）</text>
    <div class="TplBox" data-name="TplBox"></div>
    <text class="SecTitle">训练队列</text>
    <div class="QueueList" data-name="QueueList" data-comp="UILayout" data-props='{"mode":"vertical","spacingY":8,"autoLayout":true}'></div>
    <div class="DeployBox">
      <text class="DeployText" data-name="DeployText"></text>
      <button class="Btn_deploy" data-name="Btn_deploy"><text class="Label_deploy" data-name="Label_deploy">进入部署模式</text></button>
    </div>
  </div>
</widget>
