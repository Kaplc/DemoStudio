<widget name="ProductionPanel" canvas="1920x1080" active="false" data-script="gameplay/ui/ProductionPanel">
  <style>
    .Dim { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; background-color: #0b1018c0; }
    .Panel { width: 1100px; height: 860px; margin: 70px auto; display: flex; flex-direction: column; align-items: center; background-color: #1d2733; border: 2px solid #3a4a5c; border-radius: 18px; hit-test: block; }
    .Head { width: 1040px; height: 60px; margin-top: 20px; display: flex; flex-direction: row; align-items: center; }
    .Title { width: 500px; height: 48px; font-size: 30px; color: #e0a83c; text-align: left; font-weight: bold; }
    .Btn_close { width: 120px; height: 48px; margin-left: auto; display: flex; justify-content: center; align-items: center; background-color: #7a3a38; border-radius: 10px; }
    .Btn_close:hover { background-color: #964644; }
    .Label_close { width: 90px; height: 30px; font-size: 19px; color: #ffe4e0; text-align: center; }
    .MilText { width: 1000px; height: 36px; margin-top: 8px; font-size: 19px; color: #8fa3b8; text-align: left; }
    .LineTitle { width: 1040px; height: 40px; margin-top: 12px; font-size: 20px; color: #8fa3b8; text-align: left; }
    .LineList { width: 1040px; height: 480px; margin-top: 6px; }
    .AddTitle { width: 1040px; height: 40px; margin-top: 16px; font-size: 20px; color: #8fa3b8; text-align: left; }
    .AddBox { width: 1040px; height: 320px; margin-top: 6px; display: flex; flex-direction: row; flex-wrap: wrap; align-content: flex-start; }
    .Btn_equip { width: 320px; height: 88px; margin-left: 14px; margin-top: 12px; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #31445c; border-radius: 12px; }
    .Btn_equip:hover { background-color: #3d566f; }
    .Label_equip { width: 280px; height: 30px; font-size: 19px; color: #cfd8e3; text-align: center; }
    .SubLabel { width: 280px; height: 24px; font-size: 15px; color: #8fa3b8; text-align: center; }
  </style>
  <div class="Dim"></div>
  <div class="Panel">
    <div class="Head">
      <text class="Title">生产</text>
      <button class="Btn_close" data-name="Btn_close"><text class="Label_close">关闭</text></button>
    </div>
    <text class="MilText" data-name="MilText"></text>
    <text class="LineTitle">生产线（效率随时间爬升；缺资源自动降档）</text>
    <div class="LineList" data-name="LineList" data-comp="UILayout" data-props='{"mode":"vertical","spacingY":8,"autoLayout":true}'></div>
    <text class="AddTitle">新建生产线（+5 军工厂；总厂不超军工厂数）</text>
    <div class="AddBox" data-name="AddBox"></div>
  </div>
</widget>
