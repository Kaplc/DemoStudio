<widget name="QueueRow" canvas="1000x76">
  <style>
    .Root { width: 1000px; height: 76px; display: flex; flex-direction: row; align-items: center; background-color: #24313f; border-radius: 10px; }
    .NameText { width: 260px; height: 34px; margin-left: 18px; font-size: 20px; color: #e8eef5; text-align: left; }
    .InfoText { width: 200px; height: 30px; margin-left: 10px; font-size: 16px; color: #8fa3b8; text-align: left; }
    .Bar { width: 320px; height: 30px; margin-left: 10px; background-color: #17222e; border-radius: 6px; }
    .Fill { position: absolute; left: 0px; top: 0px; width: 320px; height: 30px; background-color: #6a9955; border-radius: 6px; }
    .Btn_act { width: 130px; height: 48px; margin-left: auto; margin-right: 16px; display: flex; justify-content: center; align-items: center; background-color: #31445c; border-radius: 8px; }
    .Btn_act:hover { background-color: #3d566f; }
    .Label_act { width: 110px; height: 28px; font-size: 17px; color: #cfd8e3; text-align: center; }
  </style>
  <div class="Root">
    <text class="NameText" data-name="NameText"></text>
    <text class="InfoText" data-name="InfoText"></text>
    <div class="Bar" data-name="Bar" data-comp="UIProgressBar" data-props='{"value":0,"max":100}'><div class="Fill" data-name="Fill"></div></div>
    <button class="Btn_act" data-name="Btn_act"><text class="Label_act" data-name="Label_act">操作</text></button>
  </div>
</widget>
