<widget name="DesignerPanel" canvas="1920x1080" active="false" data-script="gameplay/ui/DesignerPanel">
  <style>
    .Dim { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; background-color: #0b1018c0; }
    .Panel { width: 1240px; height: 880px; margin: 60px auto; display: flex; flex-direction: column; align-items: center; background-color: #1d2733; border: 2px solid #3a4a5c; border-radius: 18px; hit-test: block; }
    .Head { width: 1180px; height: 60px; margin-top: 20px; display: flex; flex-direction: row; align-items: center; }
    .Title { width: 560px; height: 48px; font-size: 30px; color: #e0a83c; text-align: left; font-weight: bold; }
    .Btn_close { width: 120px; height: 48px; margin-left: auto; display: flex; justify-content: center; align-items: center; background-color: #7a3a38; border-radius: 10px; }
    .Btn_close:hover { background-color: #964644; }
    .Label_close { width: 90px; height: 30px; font-size: 19px; color: #ffe4e0; text-align: center; }
    .Columns { width: 1180px; height: 620px; margin-top: 12px; display: flex; flex-direction: row; }
    .Left { width: 460px; height: 620px; display: flex; flex-direction: column; background-color: #24313f; border-radius: 12px; }
    .ColTitle { width: 420px; height: 44px; margin-top: 10px; font-size: 20px; color: #cfd8e3; text-align: center; font-weight: bold; }
    .BatList { width: 430px; height: 540px; margin-top: 6px; overflow-y: auto; }
    .Right { width: 700px; height: 620px; margin-left: 20px; display: flex; flex-direction: column; background-color: #24313f; border-radius: 12px; }
    .SupTitle { width: 660px; height: 40px; margin-top: 10px; font-size: 18px; color: #8fa3b8; text-align: center; }
    .SupBox { width: 660px; height: 130px; display: flex; flex-direction: row; flex-wrap: wrap; align-content: flex-start; }
    .Btn_sup { width: 150px; height: 52px; margin-left: 10px; margin-top: 8px; display: flex; justify-content: center; align-items: center; background-color: #31445c; border-radius: 10px; }
    .Btn_sup:hover { background-color: #3d566f; }
    .Label_sup { width: 130px; height: 26px; font-size: 15px; color: #cfd8e3; text-align: center; }
    .StatsText { width: 660px; height: 220px; margin-top: 12px; font-size: 17px; color: #a8bac9; text-align: left; }
    .SaveBox { width: 660px; height: 80px; margin-top: 12px; display: flex; flex-direction: row; align-items: center; }
    .NameInput { width: 320px; height: 56px; font-size: 20px; color: #e8eef5; background-color: #17222e; border-radius: 8px; }
    .Btn_save { width: 220px; height: 56px; margin-left: auto; margin-right: 10px; display: flex; justify-content: center; align-items: center; background-color: #6a7c34; border-radius: 10px; }
    .Btn_save:hover { background-color: #7f9440; }
    .Label_save { width: 190px; height: 30px; font-size: 19px; color: #f2f7e6; text-align: center; }
  </style>
  <div class="Dim"></div>
  <div class="Panel">
    <div class="Head">
      <text class="Title">编制设计器</text>
      <button class="Btn_close" data-name="Btn_close"><text class="Label_close">关闭</text></button>
    </div>
    <div class="Columns">
      <div class="Left">
        <text class="ColTitle">营（点击 + / − 调整数量；上限 25 营）</text>
        <div class="BatList" data-name="BatList"></div>
      </div>
      <div class="Right">
        <text class="SupTitle">支援连（点击挂载/卸下）</text>
        <div class="SupBox">
          <button class="Btn_sup" data-name="Sup_engineer"><text class="Label_sup">工兵连</text></button>
          <button class="Btn_sup" data-name="Sup_recon"><text class="Label_sup">侦察连</text></button>
          <button class="Btn_sup" data-name="Sup_artillery_support"><text class="Label_sup">炮兵支援</text></button>
          <button class="Btn_sup" data-name="Sup_logistics"><text class="Label_sup">后勤连</text></button>
        </div>
        <text class="StatsText" data-name="StatsText"></text>
        <div class="SaveBox">
          <input class="NameInput" data-name="NameInput" placeholder="编制名称" />
          <button class="Btn_save" data-name="Btn_save"><text class="Label_save">保存编制</text></button>
        </div>
      </div>
    </div>
  </div>
</widget>
