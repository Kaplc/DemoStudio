<widget name="ResearchPanel" canvas="1920x1080" active="false" data-script="gameplay/ui/ResearchPanel">
  <style>
    .Dim { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; background-color: #0b1018c0; }
    .Panel { width: 1160px; height: 900px; margin: 50px auto; display: flex; flex-direction: column; align-items: center; background-color: #1d2733; border: 2px solid #3a4a5c; border-radius: 18px; hit-test: block; }
    .Head { width: 1100px; height: 60px; margin-top: 20px; display: flex; flex-direction: row; align-items: center; }
    .Title { width: 560px; height: 48px; font-size: 30px; color: #e0a83c; text-align: left; font-weight: bold; }
    .Btn_close { width: 120px; height: 48px; margin-left: auto; display: flex; justify-content: center; align-items: center; background-color: #7a3a38; border-radius: 10px; }
    .Btn_close:hover { background-color: #964644; }
    .Label_close { width: 90px; height: 30px; font-size: 19px; color: #ffe4e0; text-align: center; }
    .SlotText { width: 1080px; height: 36px; margin-top: 8px; font-size: 19px; color: #8fa3b8; text-align: left; }
    .SecTitle { width: 1100px; height: 38px; margin-top: 12px; font-size: 20px; color: #8fa3b8; text-align: left; }
    .CurrentList { width: 1100px; height: 220px; margin-top: 4px; }
    .AvailList { width: 1100px; height: 430px; margin-top: 4px; }
  </style>
  <div class="Dim"></div>
  <div class="Panel">
    <div class="Head">
      <text class="Title">科研</text>
      <button class="Btn_close" data-name="Btn_close"><text class="Label_close">关闭</text></button>
    </div>
    <text class="SlotText" data-name="SlotText"></text>
    <text class="SecTitle">研究中的科技</text>
    <div class="CurrentList" data-name="CurrentList" data-comp="UILayout" data-props='{"mode":"vertical","spacingY":8,"autoLayout":true}'></div>
    <text class="SecTitle">可选科技（按分类）</text>
    <div class="AvailList" data-name="AvailList" data-comp="UILayout" data-props='{"mode":"grid","columns":3,"spacingX":8,"spacingY":8,"autoLayout":true}'></div>
  </div>
</widget>
