  <style>
    .Dim { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; background-color: #0b1018c0; }

    .Label_close { width: 84px; height: 28px; font-size: 18px; color: #ffe4e0; text-align: center; }
    .Tree { width: 1160px; height: 830px; margin-top: 10px; overflow-y: auto; }
    .TreeInner { position: relative; left: 0px; top: 0px; width: 1160px; height: 830px; }
    .LineV { position: absolute; width: 6px; height: 80px; background-color: #4a5c70; }
    .Node { position: absolute; width: 200px; height: 90px; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #31445c; border-radius: 12px; }
    .NodeName { width: 180px; height: 52px; font-size: 17px; color: #e8eef5; text-align: center; }
