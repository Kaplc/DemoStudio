<widget name="BattleResult" canvas="1920x1080" world="9.6x5.4" data-script="gameplay/battle/BattleResult">
  <style>
    .DimBackground { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; background-color: #0c0602b8; }
    .Panel { width: 1060px; height: 720px; position: absolute; left: 430px; top: 180px; z-index: 1; display: flex; flex-direction: row; justify-content: center; align-items: flex-start; background-color: #8a6a3a; border-radius: 22px; }
    .PanelWood { width: 1000px; height: 660px; margin-top: 0px; margin-bottom: 60px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; background-color: #3a2418; border-radius: 16px; }
    .TitleAccent { width: 240px; height: 16px; margin-top: 40px; background-color: #f0a500; border-radius: 4px; }
    .Title { width: 500px; height: 60px; margin-top: 16px; font-size: 32px; color: #ffffff; text-align: center; font-weight: bold; text-shadow: 0px 2px 6px #00000099; }
    .StarsLabel { width: 800px; height: 70px; margin-top: 60px; font-size: 34px; color: #ffd700; text-align: center; font-weight: bold; text-shadow: 0px 2px 5px #00000099; }
    .LootText { width: 800px; height: 56px; margin-top: 30px; font-size: 22px; color: #f5e6c8; text-align: center; font-weight: bold; text-shadow: 0px 2px 5px #00000099; }
    .Btn_returnBase { width: 520px; height: 120px; margin-top: 70px; display: flex; justify-content: center; align-items: center; background-color: #ffae00; border-radius: 18px; }
    .ReturnText { width: 480px; height: 60px; font-size: 28px; color: #3d2600; text-align: center; font-weight: bold; text-shadow: 0px 1px 3px #ffffff80; }
  </style>
    <div class="DimBackground"></div>
    <div class="Panel">
      <div class="PanelWood">
        <div class="TitleAccent"></div>
        <text class="Title">⚔ 战斗结束</text>
        <text class="StarsLabel">☆☆☆ 摧毁 0%</text>
        <text class="LootText">掠夺入账：🪙 金币 +0 · 🧪 药水 +0</text>
        <button class="Btn_returnBase">
          <text class="ReturnText">回基地</text>
        </button>
      </div>
    </div>
</widget>
