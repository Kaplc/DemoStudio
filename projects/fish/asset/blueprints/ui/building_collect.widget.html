<widget name="BuildingCollectBubble" canvas="160x160" data-script="gameplay/base/BuildingCollect">
  <properties>
    {
      "BuildingCollectBubble": { "UIWorldAnchorComponent": { "mode": "world", "pxPerMeter": 350, "pixelDensity": 2, "faceCamera": true } }
    }
  </properties>
  <style>
    .BubbleRoot { width: 100%; height: 100%; }
    .Bubble { width: 160px; height: 160px; position: absolute; left: 0px; top: 0px;
              display: flex; justify-content: center; align-items: center;
              background-color: rgba(255,193,7,0.95); border-radius: 80px;
              border: 4px solid #fff8e1;
              box-shadow: 0 4px 16px rgba(0,0,0,0.4); }
    .BubbleIcon { width: 120px; height: 120px; font-size: 64px; text-align: center;
                  text-shadow: 0px 2px 4px #00000099; }
  </style>
  <div class="BubbleRoot">
    <button class="Bubble"><text class="BubbleIcon">🪙</text></button>
  </div>
</widget>
