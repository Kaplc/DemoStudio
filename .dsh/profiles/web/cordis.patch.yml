# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# 此文件由 scripts/sync-dsh-plugins.mjs 在 editor.bat 启动时动态生成

# ── DemoStudio 记忆系统 ──
- insert:
    - id: ds-memory
      name: '@demostudio/ds-memory'
      config:
        memoryDir: 'E:/DemoStudio/.dsh/memory'

# ── DemoStudio 启动同步 ──
- insert:
    - id: ds-sync
      name: '@demostudio/ds-sync'
      config:
        projectRoot: 'E:/DemoStudio'

# ── DemoStudio 引擎工具 ──
- insert:
    - id: ds-engine-tools
      name: '@demostudio/ds-engine-tools'

# ── DemoStudio 插件管理器 ──
- insert:
    - id: ds-plugin-manager
      name: '@demostudio/ds-plugin-manager'

# ── DemoStudio 目录指令 ──
- insert:
    - id: ds-instructions
      name: '@demostudio/ds-instructions'
      config:
        projectRoot: 'E:/DemoStudio'

# ── DemoStudio 反馈飞轮 ──
- insert:
    - id: ds-feedback
      name: '@demostudio/ds-feedback'
      config:
        ruleDir: 'E:/DemoStudio/.dsh/rules'
        lossDir: 'E:/DemoStudio/.dsh/loss'
        gradientDir: 'E:/DemoStudio/.dsh/gradient'
        reminderDir: 'E:/DemoStudio/.dsh/reminder'

# ── DemoStudio 行为飞轮 ──
- insert:
    - id: ds-experience
      name: '@demostudio/ds-experience'
      config:
        experienceDir: 'E:/DemoStudio/.dsh/experience'

# ── DemoStudio 回合末提醒 ──
# reminders 为全量替换（缺省 = 内置两条默认提醒）；新增提醒 = 在此加条目 + .dsh/reminder/ 放文案文件
- insert:
    - id: ds-reminder
      name: '@demostudio/ds-reminder'
      config:
        reminderDir: 'E:/DemoStudio/.dsh/reminder'
        reminders:
          - id: memory-end-of-turn
            file: memory-end-of-turn.md
            channel: steer
            skipTools: [memory_write, memory_reinforce]
            summary: 回合末记忆提醒
          - id: experience-end-of-turn
            file: experience-end-of-turn.md
            channel: inject
            skipTools: [experience_save, experience_reinforce]
            summary: 回合末经验提醒
          - id: doc-update-reminder
            file: 文档更新提醒.md
            channel: inject
            summary: 文档更新提醒

# ── 行为飞轮：持久会话索引 ──
- id: session-query-sqlite
  config:
    path: 'C:/Users/Kaplc/.dsh/session-query/index.sqlite'
    openAt: first-search

# ── DemoStudio 编辑器工具 ──
- insert:
    - id: ds-editor-tools
      name: '@demostudio/ds-editor-tools'


# ── Agent 预设：游戏编辑器（源 .dsh/presets/game-editor/，改文件后重跑 editor.bat） ──
- insert:
    - id: preset-game-editor
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: game-editor
        name: "游戏编辑器"
        description: "专用游戏开发 Agent，针对 DemoStudio 游戏引擎和游戏 agent 优化，工作目录固定在 DemoStudio。"
        order: 5
        plugins:
          # 游戏编辑器 Agent Preset
          # 专用游戏开发 Agent，针对 DemoStudio 游戏引擎和游戏 agent 优化
          # 工作目录固定在 DemoStudio

          # ── identity ────────────────────────────────────────────────────────────────

          # 游戏编辑器专用 persona
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              text: >-
                You are a professional game development assistant powered by the {{model}} model.
                Your working directory is {{cwd}} — this is the DemoStudio game engine and game agent project root.
                All file operations and code analysis should be based on this directory.
                You are specialized in game engine architecture, scene management, asset optimization,
                game logic, and game agent development. You understand game development workflows,
                performance optimization, and best practices for game projects.

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          # Shell tools - 基于平台选择
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # 文件系统工具 - 游戏项目文件管理
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          # 后台任务工具 - 长时间运行的游戏构建任务
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────────

          # Skills 支持 - 可扩展游戏开发特定技能
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ───────────────────────────────────────────────────────────────────

          # 目标管理 - 跟踪游戏开发任务
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          # 计划模式 - 游戏功能设计和架构规划
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode.
                        For game development planning:
                        - Explore the game engine architecture and existing codebase first
                        - Analyze game systems (rendering, physics, AI, etc.) before proposing changes
                        - Consider performance implications for game loops and real-time systems
                        - Plan asset pipelines and resource management carefully
                        - Document game design decisions and technical constraints

                        Imperative language to implement changes means plan the implementation, not execute it.
                        A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode.

          # ── compaction ──────────────────────────────────────────────────────────────

          # 上下文压缩 - 处理长对话历史
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────

          # 委托和工作流 - 游戏开发任务分解
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              # 可选的外部工具提供者（默认禁用）
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              # 0.1.7-rc.2 起 worker-thread 独立包并入 workflow，worker 行改用 dsh-workflow-ptc
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────

          # 用户交互工具
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          # 任务跟踪工具
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # 网络工具 - 游戏资源和文档检索
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000

- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-08-13.1

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      glmen:
        displayName: glmen
        api: openai-completions
        baseURL: https://api.z.ai/api/coding/paas/v4
        apiKeyEnv: GLMEN_API_KEY
        models:
          - id: glm-5.3-flash
            name: glm5.3f
            contextWindow: 512000
            input:
              - text
              - image

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: glmen
    model: glm-5.3-flash
