# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# 此文件由 scripts/sync-dsh-plugins.mjs 在 editor.bat 启动时动态生成

# ── DemoStudio 记忆系统 ──
- insert:
    - id: ds-memory
      name: '@demostudio/ds-memory'
      config:
        memoryDir: 'E:/DemoStudio/.dsh/memory'

# ── DemoStudio 启动同步 ──
- insert:
    - id: ds-sync
      name: '@demostudio/ds-sync'
      config:
        projectRoot: 'E:/DemoStudio'

# ── DemoStudio 引擎工具 ──
- insert:
    - id: ds-engine-tools
      name: '@demostudio/ds-engine-tools'

# ── DemoStudio 插件管理器 ──
- insert:
    - id: ds-plugin-manager
      name: '@demostudio/ds-plugin-manager'

# ── DemoStudio 目录指令 ──
- insert:
    - id: ds-instructions
      name: '@demostudio/ds-instructions'
      config:
        projectRoot: 'E:/DemoStudio'

# ── DemoStudio 反馈飞轮 ──
- insert:
    - id: ds-feedback
      name: '@demostudio/ds-feedback'
      config:
        ruleDir: 'E:/DemoStudio/.dsh/rules'

# ── DemoStudio 行为飞轮 ──
- insert:
    - id: ds-experience
      name: '@demostudio/ds-experience'
      config:
        experienceDir: 'E:/DemoStudio/.dsh/experience'

# ── 行为飞轮：持久会话索引 ──
- id: session-query-sqlite
  config:
    path: 'C:/Users/v_zhyyzheng/.dsh/session-query/index.sqlite'
    openAt: first-search

# ── DemoStudio 编辑器工具 ──
- insert:
    - id: ds-editor-tools
      name: '@demostudio/ds-editor-tools'

# ── DemoStudio 上下文警告 ──
- insert:
    - id: ds-context-warning
      name: '@demostudio/ds-context-warning'
      config:
        projectRoot: 'E:/DemoStudio'
        thresholdsK: [100,200,250,300]
