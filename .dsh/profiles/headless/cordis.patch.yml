# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
# 此文件由 scripts/sync-dsh-plugins.mjs 在 editor.bat 启动时动态生成

# ── DemoStudio 记忆系统 ──
- insert:
    - id: ds-memory
      name: '@demostudio/ds-memory'
      config:
        memoryDir: 'E:/DemoStudio/.dsh/memory'

# ── DemoStudio 启动同步 ──
- insert:
    - id: ds-sync
      name: '@demostudio/ds-sync'
      config:
        projectRoot: 'E:/DemoStudio'

# ── DemoStudio 引擎工具 ──
- insert:
    - id: ds-engine-tools
      name: '@demostudio/ds-engine-tools'

# ── DemoStudio 插件管理器 ──
- insert:
    - id: ds-plugin-manager
      name: '@demostudio/ds-plugin-manager'

# ── DemoStudio 目录指令 ──
- insert:
    - id: ds-instructions
      name: '@demostudio/ds-instructions'
      config:
        projectRoot: 'E:/DemoStudio'

# ── DemoStudio 反馈飞轮 ──
- insert:
    - id: ds-feedback
      name: '@demostudio/ds-feedback'
      config:
        ruleDir: 'E:/DemoStudio/.dsh/rules'

# ── DemoStudio 行为飞轮 ──
- insert:
    - id: ds-experience
      name: '@demostudio/ds-experience'
      config:
        experienceDir: 'E:/DemoStudio/.dsh/experience'

# ── DemoStudio 回合末提醒 ──
# reminders 为全量替换（缺省 = 内置两条默认提醒）；新增提醒 = 在此加条目 + .dsh/reminder/ 放文案文件
- insert:
    - id: ds-reminder
      name: '@demostudio/ds-reminder'
      config:
        reminderDir: 'E:/DemoStudio/.dsh/reminder'
        reminders:
          - id: memory-end-of-turn
            file: memory-end-of-turn.md
            channel: steer
            skipTools: [memory_write]
            summary: 回合末记忆提醒
          - id: experience-end-of-turn
            file: experience-end-of-turn.md
            channel: inject
            skipTools: [experience_save]
            summary: 回合末经验提醒
          - id: doc-update-reminder
            file: 文档更新提醒.md
            channel: inject
            summary: 文档更新提醒

# ── 行为飞轮：持久会话索引 ──
- id: session-query-sqlite
  config:
    path: 'C:/Users/Kaplc/.dsh/session-query/index.sqlite'
    openAt: first-search

# ── DemoStudio 编辑器工具 ──
- insert:
    - id: ds-editor-tools
      name: '@demostudio/ds-editor-tools'
