<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DemoStudio 加载中</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1a2e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-app-region: drag;
  }
  .container {
    text-align: center;
  }
  .logo {
    font-size: 28px;
    font-weight: 700;
    color: #e0e0e0;
    letter-spacing: 3px;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 12px;
    color: #888;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 48px;
  }
  .status {
    font-size: 12px;
    color: #aaa;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
  }
  .dot {
    display: inline-block;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>
<div class="container">
  <div class="logo">DemoStudio</div>
  <div class="subtitle">Editor v0.1.0</div>
  <div class="status">正在启动<span class="dot">.</span><span class="dot">.</span><span class="dot">.</span></div>
</div>
</body>
</html>
