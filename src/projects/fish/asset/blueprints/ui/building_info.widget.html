<widget name="BuildingInfoCard" canvas="520x300" data-script="gameplay/base/BuildingInfo">
  <style>
    .CardRoot { width: 100%; height: 100%; }
    .Card { width: 520px; height: 300px; position: absolute; left: 0px; top: 0px;
            background-color: rgba(20,14,6,0.88); border-radius: 28px;
            border: 3px solid rgba(255,174,0,0.75);
            box-shadow: 0 6px 24px rgba(0,0,0,0.45); }
    .BuildingName { width: 460px; height: 52px; position: absolute; left: 30px; top: 22px;
                    font-size: 34px; color: #ffd75e; text-align: center; font-weight: bold;
                    text-shadow: 0px 2px 6px #00000099; }
    .BuildingLevel { width: 460px; height: 44px; position: absolute; left: 30px; top: 78px;
                     font-size: 26px; color: #e8dcc0; text-align: center;
                     text-shadow: 0px 1px 4px #00000099; }
    .Btn_collect { width: 210px; height: 84px; position: absolute; left: 40px; top: 150px;
                   display: flex; justify-content: center; align-items: center;
                   background-color: #4caf50; border-radius: 18px; }
    .Btn_collect:hover { background-color: #66bb6a; }
    .Label_collect { width: 170px; height: 44px; font-size: 30px; color: #ffffff; text-align: center; font-weight: bold;
                     text-shadow: 0px 1px 3px #00000099; }
    .Btn_upgrade { width: 210px; height: 84px; position: absolute; left: 270px; top: 150px;
                   display: flex; justify-content: center; align-items: center;
                   background-color: #ffae00; border-radius: 18px; }
    .Btn_upgrade:hover { background-color: #ffc233; }
    .Label_upgrade { width: 170px; height: 44px; font-size: 30px; color: #3d2600; text-align: center; font-weight: bold;
                     text-shadow: 0px 1px 3px #00000066; }
    .Btn_close { width: 60px; height: 60px; position: absolute; right: 16px; top: 14px;
                 display: flex; justify-content: center; align-items: center;
                 background-color: #4e342e; border-radius: 30px; }
    .Btn_close:hover { background-color: #6d4c41; }
    .Label_close { width: 44px; height: 44px; font-size: 30px; color: #f5e6c8; text-align: center;
                   text-shadow: 0px 1px 3px #00000066; }
  </style>
  <div class="CardRoot">
    <div class="Card">
      <text class="BuildingName"></text>
      <text class="BuildingLevel"></text>
      <button class="Btn_collect"><text class="Label_collect">收 集</text></button>
      <button class="Btn_upgrade"><text class="Label_upgrade">升 级</text></button>
      <button class="Btn_close"><text class="Label_close">✕</text></button>
    </div>
  </div>
</widget>
