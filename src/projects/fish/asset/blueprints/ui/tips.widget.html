<widget name="TipsPanel" canvas="1920x1080" world="9.6x5.4" data-script="gameplay/base/Tips">
  <style>
    .TipsBackground { width: 1920px; height: 1080px; position: absolute; left: 0px; top: 0px; background-color: #0000004d; }
    .TipsPanelBody { width: 800px; height: 500px; margin: 290px auto; z-index: 1; display: flex; flex-direction: column; align-items: center; background-color: #3a2418; border-radius: 24px; }
    .IconText { width: 100px; height: 87px; margin-top: 30px; font-size: 48px; color: #ffffff; text-align: center; text-shadow: 0px 1px 4px #00000066; }
    .TitleText { width: 600px; height: 47px; margin-top: 14px; font-size: 28px; color: #ffd54f; text-align: center; font-weight: bold; text-shadow: 0px 2px 4px #00000080; }
    .MessageText { width: 640px; height: 187px; margin-top: 14px; font-size: 22px; color: #f5e6c8; text-align: center; text-shadow: 0px 1px 3px #00000066; }
    .Btn_close { width: 260px; height: 78px; margin-top: 14px; display: flex; justify-content: center; align-items: center; background-color: #ffae00; border-radius: 18px; }
    .Label_close { width: 200px; height: 40px; font-size: 24px; color: #3d2600; text-align: center; font-weight: bold; text-shadow: 0px 1px 2px #ffffff4d; }
  </style>
  <div class="TipsBackground"></div>
  <div class="TipsPanelBody">
    <text class="IconText">⚠️</text>
    <text class="TitleText">提示</text>
    <text class="MessageText">金币不足</text>
    <button class="Btn_close">
      <text class="Label_close">确定</text>
    </button>
  </div>
</widget>
