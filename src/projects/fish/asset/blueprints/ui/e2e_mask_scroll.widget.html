<widget name="E2eMaskScroll" canvas="1920x1080" world="9.6x5.4">
  <style>
    .Title { width: 500px; height: 50px; position: absolute; left: 60px; top: 30px; font-size: 32px; color: #ffffff; }
    /* 竖向滚动 + 圆角裁剪：预期 UIMask(radius=24px) + UIScrollContainer(vertical) + VScroll_ScrollContent 内容层 */
    .VScroll { width: 600px; height: 400px; position: absolute; left: 120px; top: 260px; background-color: #1e2a4acc; border-radius: 24px; overflow-y: auto; }
    .VItem1 { width: 540px; height: 80px; background-color: #e74c3c; font-size: 28px; color: #ffffff; text-align: center; }
    .VItem2 { width: 540px; height: 80px; background-color: #3498db; font-size: 28px; color: #ffffff; text-align: center; }
    .VItem3 { width: 540px; height: 80px; background-color: #2ecc71; font-size: 28px; color: #ffffff; text-align: center; }
    .VItem4 { width: 540px; height: 80px; background-color: #f39c12; font-size: 28px; color: #ffffff; text-align: center; }
    .VItem5 { width: 540px; height: 80px; background-color: #9b59b6; font-size: 28px; color: #ffffff; text-align: center; }
    .VItem6 { width: 540px; height: 80px; background-color: #16a085; font-size: 28px; color: #ffffff; text-align: center; }
    .VItem7 { width: 540px; height: 80px; background-color: #d35400; font-size: 28px; color: #ffffff; text-align: center; }
    .VItem8 { width: 540px; height: 80px; background-color: #2c3e50; font-size: 28px; color: #ffffff; text-align: center; }
    /* 横向滚动：flex row 内容超宽（3×260+2×20=820 > 500），flex-shrink:0 保证溢出 */
    .HScroll { width: 500px; height: 160px; position: absolute; left: 820px; top: 260px; background-color: #143a2acc; border-radius: 16px; overflow-x: auto; display: flex; flex-direction: row; gap: 20px; align-items: center; }
    .HItem1 { width: 260px; height: 100px; flex-shrink: 0; background-color: #c0392b; font-size: 26px; color: #ffffff; text-align: center; }
    .HItem2 { width: 260px; height: 100px; flex-shrink: 0; background-color: #2980b9; font-size: 26px; color: #ffffff; text-align: center; }
    .HItem3 { width: 260px; height: 100px; flex-shrink: 0; background-color: #27ae60; font-size: 26px; color: #ffffff; text-align: center; }
    /* 纯圆角遮罩（无滚动）：大子项超出容器，四角被裁剪 */
    .MaskPanel { width: 400px; height: 300px; position: absolute; left: 820px; top: 500px; background-color: #3a1e4acc; border-radius: 40px; overflow: hidden; }
    .BigChild { width: 520px; height: 420px; background-color: #16a085; }
    /* UILayout grid wrap + autoHeight 运行时重排：列数由容器宽推导（3 列），autoHeight 收缩容器高到内容高 */
    .WrapList { width: 600px; height: 300px; position: absolute; left: 120px; top: 720px; background-color: #2c3e50cc; }
    .WItem1 { width: 180px; height: 70px; background-color: #8e44ad; font-size: 24px; color: #ffffff; text-align: center; }
    .WItem2 { width: 180px; height: 70px; background-color: #2c3e50; font-size: 24px; color: #ffffff; text-align: center; }
    .WItem3 { width: 180px; height: 70px; background-color: #c0392b; font-size: 24px; color: #ffffff; text-align: center; }
    .WItem4 { width: 180px; height: 70px; background-color: #d35400; font-size: 24px; color: #ffffff; text-align: center; }
    .WItem5 { width: 180px; height: 70px; background-color: #27ae60; font-size: 24px; color: #ffffff; text-align: center; }
    .WItem6 { width: 180px; height: 70px; background-color: #2980b9; font-size: 24px; color: #ffffff; text-align: center; }
    .WItem7 { width: 180px; height: 70px; background-color: #f39c12; font-size: 24px; color: #ffffff; text-align: center; }
  </style>
  <text class="Title">E2E Mask/Scroll 运行时自测</text>
  <div class="VScroll">
    <div class="VItem1">条目 1</div>
    <div class="VItem2">条目 2</div>
    <div class="VItem3">条目 3</div>
    <div class="VItem4">条目 4</div>
    <div class="VItem5">条目 5</div>
    <div class="VItem6">条目 6</div>
    <div class="VItem7">条目 7</div>
    <div class="VItem8">条目 8</div>
  </div>
  <div class="HScroll">
    <div class="HItem1">横向 1</div>
    <div class="HItem2">横向 2</div>
    <div class="HItem3">横向 3</div>
  </div>
  <div class="MaskPanel">
    <div class="BigChild"></div>
  </div>
  <div class="WrapList" data-comp="UILayout" data-props='{&quot;mode&quot;:&quot;grid&quot;,&quot;spacingX&quot;:0.1,&quot;spacingY&quot;:0.1,&quot;autoLayout&quot;:true,&quot;wrap&quot;:true,&quot;autoHeight&quot;:true}'>
    <div class="WItem1">W1</div>
    <div class="WItem2">W2</div>
    <div class="WItem3">W3</div>
    <div class="WItem4">W4</div>
    <div class="WItem5">W5</div>
    <div class="WItem6">W6</div>
    <div class="WItem7">W7</div>
  </div>
</widget>
