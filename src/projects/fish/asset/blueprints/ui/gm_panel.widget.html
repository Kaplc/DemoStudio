<widget name="GMPanelRoot" canvas="1920x1080" world="9.6x5.4">
  <style>
    .GM_Dim { width: 1920px; height: 1080px; position: absolute; left: 0px; top: 0px; z-index: 1; background-color: #0a061499; }
    .GM_PanelFrame { width: 1520px; height: 840px; margin: 120px auto; z-index: 2; background-color: #c9a227; border-radius: 18px; }
    .GM_Panel { width: 1480px; height: 800px; margin: 20px auto; z-index: 3; background-color: #2a1a3a; border-radius: 12px; }
    .GM_Title { width: 800px; height: 44px; margin: 56px auto 0px auto; font-size: 30px; color: #ffd700; text-align: center; font-weight: bold; text-shadow: 0px 2px 4px #00000066; }
    .GM_SearchInput { width: 700px; height: 44px; margin: 10px auto 0px auto; background-color: #1a1028; border-radius: 6px; font-size: 14px; color: #f5ecd7; }
    .GM_CmdList { width: 700px; height: 240px; margin: 10px auto 0px auto; background-color: #1a102880; border-radius: 8px; overflow-y: auto; }
    .GM_Output { width: 1300px; height: 200px; margin: 10px auto 0px auto; font-size: 15px; color: #ffe28a; text-align: left; line-height: 1.25; text-shadow: 0px 1px 4px #00000066; }
    .GM_Hint { width: 1300px; height: 26px; margin: 10px auto 0px auto; font-size: 14px; color: #9a8ab0; text-align: center; text-shadow: 0px 1px 4px #00000066; }
    .GM_InputRow { width: 1300px; height: 84px; margin: 10px auto 0px auto; display: flex; justify-content: space-between; align-items: center; }
    .GM_InputBox { width: 1128px; height: 84px; background-color: #1a1028; border-radius: 8px; font-size: 22px; color: #f5ecd7; }
    .GM_SendBtn { width: 160px; height: 84px; display: flex; justify-content: center; align-items: center; background-color: #ffd700; border-radius: 10px; }
    .SendLabel { width: 130px; height: 50px; font-size: 20px; color: #2a1a3a; text-align: center; font-weight: bold; text-shadow: 0px 1px 4px #00000066; }
    .Button { width: 76px; height: 70px; display: flex; justify-content: center; align-items: center; position: absolute; right: 16px; top: 16px; background-color: #4a6fa5; border-radius: 8px; }
    .Text { width: 60px; height: 50px; font-size: 28px; color: #ffffff; text-align: center; text-shadow: 0px 1px 4px #00000066; }
  </style>
    <div class="GM_Dim"></div>
    <div class="GM_PanelFrame">
      <div class="GM_Panel">
        <text class="GM_Title">⚔️ ClashMaster GM 控制台</text>
              <input class="GM_SearchInput" placeholder="🔍 搜索命令（名称/描述）..." />
              <div class="GM_CmdList" data-comp="UIScrollList" data-props='{&quot;itemWidget&quot;:&quot;asset/blueprints/ui/gm_cmd_item.widget.json&quot;,&quot;itemSize&quot;:[2.7,0.24],&quot;spacing&quot;:0.02,&quot;zOrderLift&quot;:0,&quot;draggable&quot;:true,&quot;scrollbar&quot;:true}'></div>
              <text class="GM_Output"></text>
              <text class="GM_Hint">Enter 执行 · Tab 切换搜索/输入 · Esc 关闭 · G+M 开关面板</text>
              <div class="GM_InputRow">
          <input class="GM_InputBox" placeholder="输入 GM 命令（help 查看全部）..." />
                  <button class="GM_SendBtn" data-comp="Clickable" data-props='{}'>
            <text class="SendLabel">发送</text>
          </button>
        </div>
              <button class="Button" data-comp="Clickable" data-props='{}'>
          <text class="Text">X</text>
        </button>
      </div>
    </div>
</widget>
