<widget name="MapPanel" canvas="1920x1080" world="9.6x5.4" data-script="gameplay/base/MapPanel">
  <style>
    .DimBackground { width: 1920px; height: 1080px; position: absolute; left: 0px; top: 0px; background-color: #0c0602b8; }
    .Panel { width: 1540px; height: 1020px; position: absolute; left: 190px; top: 30px; z-index: 1; background-color: #8a6a3a; border-radius: 24px; }
    .PanelWood { width: 1480px; height: 960px; margin-left: 30px; margin-top: 0px; margin-bottom: 60px; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; position: relative; background-color: #3a2418; border-radius: 18px; }
    .TitleAccent { width: 240px; height: 16px; margin-top: 30px; background-color: #f0a500; border-radius: 4px; }
    .Title { width: 400px; height: 60px; margin-top: 14px; font-size: 32px; color: #ffffff; text-align: center; font-weight: bold; text-shadow: 0px 2px 6px #00000099; }
    .Desc { width: 400px; height: 48px; margin-top: 8px; font-size: 18px; color: #f5e6c8; text-align: center; text-shadow: 0px 1px 4px #00000073; }
    .LevelList { width: 1360px; height: 600px; margin-top: 30px; }
    .Btn_mapClose { width: 104px; height: 104px; display: flex; justify-content: center; align-items: center; position: absolute; right: 16px; top: 40px; z-index: 2; background-color: #5a1f1f; border-radius: 16px; }
    .Label_mapClose { width: 100px; height: 60px; font-size: 28px; color: #ffe3e0; text-align: center; font-weight: bold; text-shadow: 0px 1px 3px #00000080; }
  </style>
    <div class="DimBackground"></div>
    <div class="Panel">
      <div class="PanelWood">
        <div class="TitleAccent"></div>
        <text class="Title">🗺️ 选择关卡</text>
        <text class="Desc">点击关卡开始挑战</text>
        <div class="LevelList"></div>
        <button class="Btn_mapClose">
          <text class="Label_mapClose">✕</text>
        </button>
      </div>
    </div>
</widget>
