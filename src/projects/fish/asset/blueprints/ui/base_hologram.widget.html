<widget name="base_hologram" canvas="960x540"
        data-comp="UIWorldAnchorComponent"
        data-props='{"mode":"world","pxPerMeter":200,"pixelDensity":2,"faceCamera":true}'>
  <style>
    .Root { width: 100%; height: 100%; }
    .Panel { width: 960px; height: 540px; position: absolute; left: 0px; top: 0px;
             background-color: rgba(10,40,70,0.55); border-radius: 24px;
             border: 3px solid rgba(90,200,255,0.6); }
    .Title { width: 960px; height: 72px; position: absolute; left: 0px; top: 24px;
             font-size: 40px; color: #7fd8ff; text-align: center; font-weight: bold;
             text-shadow: 0 2px 8px rgba(0,180,255,0.6); }
    .Info { width: 960px; height: 60px; position: absolute; left: 0px; top: 120px;
            font-size: 28px; color: #bfe9ff; text-align: center;
            text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
    .Hint { width: 960px; height: 40px; position: absolute; left: 0px; top: 200px;
            font-size: 22px; color: rgba(191,233,255,0.55); text-align: center;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
  </style>
  <div class="Root">
    <div class="Panel"></div>
    <text class="Title">基地核心</text>
    <text class="Info">全息面板 · World-Space UI</text>
    <text class="Hint">绕到背后可见朝向跟随（billboard）</text>
  </div>
</widget>
