<widget name="BarracksPanel" canvas="1920x1080" world="9.6x5.4" data-script="gameplay/base/BarracksUi">
  <style>
    .DimBackground { width: 1920px; height: 1080px; position: absolute; left: 0px; top: 0px; background-color: #0c0602b8; }
    .Panel { width: 1480px; height: 1000px; margin: 40px auto; z-index: 1; background-color: #8a6a3a; border-radius: 24px; }
    .PanelWood { width: 1440px; height: 960px; margin: 20px auto; display: flex; flex-direction: column; align-items: center; background-color: #3a2418; border-radius: 18px; }
    .TitleAccent { width: 240px; height: 16px; margin-top: 102px; background-color: #f0a500; border-radius: 4px; }
    .Title { width: 800px; height: 50px; margin-top: 12px; font-size: 32px; color: #ffffff; text-align: center; font-weight: bold; text-shadow: 1px 2px 6px #00000099; }
    .Desc { width: 800px; height: 40px; margin-top: 12px; font-size: 18px; color: #f5e6c8; text-align: center; text-shadow: 1px 2px 4px #00000073; }
    .TroopList { width: 1100px; height: 380px; margin-top: 12px; background-color: #00000042; border-radius: 14px; }
    .QueueLabel { width: 1000px; height: 36px; margin-top: 12px; font-size: 17px; color: #ffd700; text-align: center; text-shadow: 1px 2px 4px #00000080; }
    .ArmyLabel { width: 1000px; height: 36px; margin-top: 12px; font-size: 17px; color: #a5d6a7; text-align: center; text-shadow: 1px 2px 4px #00000080; }
    .CapacityLabel { width: 1000px; height: 36px; margin-top: 12px; font-size: 17px; color: #90caf9; text-align: center; text-shadow: 1px 2px 4px #00000080; }
    .Btn_barracksClose { width: 260px; height: 78px; display: flex; justify-content: center; align-items: center; margin-top: 12px; background-color: #ffae00; border-radius: 16px; }
    .Label_close { width: 200px; height: 40px; font-size: 24px; color: #3d2600; text-align: center; font-weight: bold; text-shadow: 0px 1px 2px #ffffff4d; }
  </style>
    <div class="DimBackground"></div>
    <div class="Panel">
      <div class="PanelWood">
        <div class="TitleAccent"></div>
        <text class="Title">⚔️ 兵营</text>
        <text class="Desc">选择兵种训练</text>
        <div class="TroopList" data-comp="UILayout" data-props='{&quot;mode&quot;:&quot;grid&quot;,&quot;columns&quot;:5,&quot;spacingX&quot;:0.15,&quot;spacingY&quot;:0.15,&quot;autoLayout&quot;:true}'></div>
        <text class="QueueLabel">训练队列: 空闲</text>
        <text class="ArmyLabel">当前军队: 无</text>
        <text class="CapacityLabel">军队容量: 0/40</text>
        <button class="Btn_barracksClose">
          <text class="Label_close">🏠 关闭</text>
        </button>
      </div>
    </div>
</widget>
