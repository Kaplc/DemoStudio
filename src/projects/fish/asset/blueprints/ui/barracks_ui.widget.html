<widget name="BarracksPanel" canvas="1920x1080" world="9.6x5.4">
  <style>
    .DimBackground { width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%; z-order: 1; background-color: rgba(12,6,2,0.72); opacity: 0.72; z-order: 1; }
    .Panel { width: 1520px; height: 1000px; position: absolute; left: 50%; top: 50%; z-order: 2; background-color: #8a6a3a; border-radius: 24px; z-order: 2; }
    .PanelWood { width: 1480px; height: 960px; position: absolute; left: 50%; top: 50%; z-order: 3; background-color: #3a2418; border-radius: 18px; z-order: 3; }
    .TitleAccent { width: 240px; height: 16px; position: absolute; left: 50%; top: -5.19%; z-order: 4; background-color: #f0a500; border-radius: 4px; z-order: 4; }
    .Title { width: 800px; height: 120px; position: absolute; left: 50%; top: 9.26%; z-order: 5; font-size: 32px; color: #ffffff; text-align: center; font-weight: bold; text-shadow-color: rgba(0,0,0,0.6); text-shadow-blur: 6px; }
    .Desc { width: 800px; height: 70px; position: absolute; left: 50%; top: 16.57%; z-order: 6; font-size: 18px; color: #f5e6c8; text-align: center; text-shadow-color: rgba(0,0,0,0.45); }
    .TroopList { width: 1100px; height: 380px; position: absolute; left: 50%; top: 44.07%; z-order: 7; display: flex; flex-direction: row; gap: 30px; }
    .QueueLabel { width: 1000px; height: 52px; position: absolute; left: 50%; top: 65.74%; z-order: 8; font-size: 17px; color: #ffd700; text-align: center; text-shadow-color: rgba(0,0,0,0.5); }
    .ArmyLabel { width: 1000px; height: 52px; position: absolute; left: 50%; top: 70.37%; z-order: 9; font-size: 17px; color: #a5d6a7; text-align: center; text-shadow-color: rgba(0,0,0,0.5); }
    .CapacityLabel { width: 1000px; height: 52px; position: absolute; left: 50%; top: 75.93%; z-order: 10; font-size: 17px; color: #90caf9; text-align: center; text-shadow-color: rgba(0,0,0,0.5); }
    .Btn_barracksClose { width: 320px; height: 100px; position: absolute; left: 50%; top: 91.48%; z-order: 11; }
    .Frame_close { width: 340px; height: 116px; position: absolute; left: 50%; top: 50%; z-order: 12; background-color: #ffae00; border-radius: 18px; z-order: 12; }
    .Label_close { width: 300px; height: 80px; position: absolute; left: 50%; top: 50%; z-order: 13; font-size: 24px; color: #3d2600; text-align: center; font-weight: bold; text-shadow-color: rgba(255,255,255,0.3); text-shadow-blur: 2px; }
  </style>
  <img class="DimBackground" />
  <div class="Panel">
    <img class="PanelWood" />
      <img class="TitleAccent" />
      <text class="Title">⚔️ 兵营</text>
      <text class="Desc">选择兵种训练</text>
      <div class="TroopList"></div>
      <text class="QueueLabel">训练队列: 空闲</text>
      <text class="ArmyLabel">当前军队: 无</text>
      <text class="CapacityLabel">军队容量: 0/40</text>
      <button class="Btn_barracksClose">
      <img class="Frame_close" />
          <text class="Label_close">🏠 关闭</text>
    </button>
  </div>
</widget>
