<widget name="GemShopPanel" canvas="1920x1080" world="9.6x5.4" data-script="gameplay/base/GemShop">
  <style>
    .DimBackground { width: 100%; height: 100%; position: absolute; left: 0px; top: 0px; background-color: #0c0602b8; }
    .Panel { width: 1540px; height: 1020px; display: flex; flex-direction: column; align-items: center; margin: 30px auto; z-index: 1; background-color: #8a6a3a; border-radius: 24px; }
    .PanelWood { width: 1480px; height: 960px; display: flex; flex-direction: column; align-items: center; background-color: #3a2418; border-radius: 18px; }
    .TitleAccent { width: 240px; height: 16px; margin-top: 28px; background-color: #f0a500; border-radius: 4px; }
    .Title { width: 400px; height: 60px; margin-top: 14px; font-size: 32px; color: #ffffff; text-align: center; font-weight: bold; text-shadow: 0px 2px 6px #00000099; }
    .GemBalanceText { width: 400px; height: 50px; margin-top: 8px; font-size: 24px; color: #ffd54f; text-align: center; font-weight: bold; text-shadow: 0px 1px 4px #00000080; }
    .ShopItems { width: 1160px; height: 480px; margin-top: 24px; display: flex; flex-direction: row; align-items: flex-start; gap: 60px; }
    .BuyCoins { width: 520px; height: 480px; display: flex; flex-direction: column; align-items: center; background-color: #2a1a0a; border-radius: 16px; }
    .CoinIcon { width: 100px; height: 100px; margin-top: 40px; font-size: 48px; text-align: center; font-weight: bold; text-shadow: 0px 1px 4px #00000066; }
    .CoinTitle { width: 400px; height: 50px; margin-top: 16px; font-size: 22px; text-align: center; font-weight: bold; text-shadow: 0px 1px 4px #00000080; }
    .CoinAmount { width: 400px; height: 40px; margin-top: 8px; font-size: 18px; color: #a5d6a7; text-align: center; text-shadow: 0px 1px 4px #00000066; }
    .CoinPrice { width: 400px; height: 40px; margin-top: 8px; font-size: 18px; color: #ff9800; text-align: center; font-weight: bold; text-shadow: 0px 1px 4px #00000066; }
    .Btn_buyCoins { width: 380px; height: 100px; display: flex; justify-content: center; align-items: center; margin-top: 20px; background-color: #4caf50; border-radius: 18px; }
    .Label_buyCoins { width: 320px; height: 50px; font-size: 20px; color: #ffffff; text-align: center; font-weight: bold; text-shadow: 0px 1px 4px #00000080; }
    .BuyElixir { width: 520px; height: 480px; display: flex; flex-direction: column; align-items: center; background-color: #2a1a0a; border-radius: 16px; }
    .ElixirIcon { width: 100px; height: 100px; margin-top: 40px; font-size: 48px; text-align: center; font-weight: bold; text-shadow: 0px 1px 4px #00000066; }
    .ElixirTitle { width: 400px; height: 50px; margin-top: 16px; font-size: 22px; text-align: center; font-weight: bold; text-shadow: 0px 1px 4px #00000080; }
    .ElixirAmount { width: 400px; height: 40px; margin-top: 8px; font-size: 18px; color: #a5d6a7; text-align: center; text-shadow: 0px 1px 4px #00000066; }
    .ElixirPrice { width: 400px; height: 40px; margin-top: 8px; font-size: 18px; color: #ff9800; text-align: center; font-weight: bold; text-shadow: 0px 1px 4px #00000066; }
    .Btn_buyElixir { width: 380px; height: 100px; display: flex; justify-content: center; align-items: center; margin-top: 20px; background-color: #9c27b0; border-radius: 18px; }
    .Label_buyElixir { width: 320px; height: 50px; font-size: 20px; color: #ffffff; text-align: center; font-weight: bold; text-shadow: 0px 1px 4px #00000080; }
    .Btn_close { width: 320px; height: 100px; display: flex; justify-content: center; align-items: center; margin-top: 28px; background-color: #ffae00; border-radius: 18px; }
    .Label_close { width: 300px; height: 60px; font-size: 24px; color: #3d2600; text-align: center; font-weight: bold; text-shadow: 0px 1px 2px #ffffff4d; }
  </style>
    <div class="DimBackground"></div>
    <div class="Panel">
      <div class="PanelWood">
        <div class="TitleAccent"></div>
        <text class="Title">💎 宝石商店</text>
        <text class="GemBalanceText">💎 0 宝石</text>
        <div class="ShopItems">
          <div class="BuyCoins">
            <text class="CoinIcon">🪙</text>
            <text class="CoinTitle">购买金币</text>
            <text class="CoinAmount">1000 金币</text>
            <text class="CoinPrice">💎 5 宝石</text>
            <button class="Btn_buyCoins">
              <text class="Label_buyCoins">购买</text>
            </button>
          </div>
          <div class="BuyElixir">
            <text class="ElixirIcon">🧪</text>
            <text class="ElixirTitle">购买药水</text>
            <text class="ElixirAmount">1000 药水</text>
            <text class="ElixirPrice">💎 5 宝石</text>
            <button class="Btn_buyElixir">
              <text class="Label_buyElixir">购买</text>
            </button>
          </div>
        </div>
        <button class="Btn_close">
          <text class="Label_close">🏠 关闭</text>
        </button>
      </div>
    </div>
</widget>
