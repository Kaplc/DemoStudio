<widget name="FishBaseHUD" canvas="1920x1080" world="9.6x5.4" data-script="gameplay/base/BaseHud">
  <style>
    /* 全屏容器：所有分区 absolute 显式定位（布局求解器要求显式宽高，否则子项高度会被压缩） */
    .TopBar { width: 1920px; height: 1080px; position: absolute; left: 0px; top: 0px; }

    /* ── 左上：等级徽章 + 昵称 + 经验条 ── */
    .PersonalCenter { width: 342px; height: 72px; position: absolute; left: 12px; top: 10px; display: flex; flex-direction: row; align-items: center; }
    .LevelBadge { width: 66px; height: 66px; flex-shrink: 0; background-color: #3f7fd6; border-radius: 12px; border: 3px solid #ffffffcc; display: flex; align-items: center; justify-content: center; }
    .LevelNum { width: 66px; font-size: 26px; color: #ffffff; font-weight: bold; text-align: center; text-shadow: 0px 1px 2px #00000099; }
    .PersonalCol { width: 260px; height: 70px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; margin-left: 10px; }
    .PlayerName { width: 260px; height: 26px; font-size: 18px; color: #ffffff; font-weight: bold; text-shadow: 0px 1px 2px #000000b3; }
    .XpTrack { width: 248px; height: 20px; flex-shrink: 0; background-color: #241a10e0; border-radius: 10px; border: 2px solid #f5e7c855; display: flex; align-items: center; padding: 3px; margin-top: 6px; }
    .XpFill { width: 148px; height: 10px; flex-shrink: 0; background-color: #58a8e8; border-radius: 5px; }

    /* ── 右上：三条资源栏（数字右对齐 + 图标靠右端，同参考图） ── */
    .ResCol { width: 324px; height: 184px; position: absolute; right: 18px; top: 10px; display: flex; flex-direction: column; gap: 8px; }
    .ResPill { width: 300px; height: 52px; flex-shrink: 0; background-color: #241a10e0; border-radius: 12px; border: 2px solid #f5e7c866; display: flex; flex-direction: row; align-items: center; padding: 0px 10px; }
    .GoldLabel { width: 224px; height: 30px; flex-shrink: 0; font-size: 22px; color: #ffffff; font-weight: bold; text-align: right; text-shadow: 0px 1px 3px #000000b3; margin-right: 12px; }
    .ElixirLabel { width: 224px; height: 30px; flex-shrink: 0; font-size: 22px; color: #ffffff; font-weight: bold; text-align: right; text-shadow: 0px 1px 3px #000000b3; margin-right: 12px; }
    .GemLabel { width: 224px; height: 30px; flex-shrink: 0; font-size: 22px; color: #ffffff; font-weight: bold; text-align: right; text-shadow: 0px 1px 3px #000000b3; margin-right: 12px; }
    .ResIcon { width: 36px; height: 36px; flex-shrink: 0; font-size: 26px; text-align: center; text-shadow: 0px 2px 4px #000000b3; }

    /* ── 顶部中央：工人 / 护盾信息条（显式坐标居中：428 宽 → left 746） ── */
    .TopCenterRow { width: 428px; height: 52px; position: absolute; left: 746px; top: 10px; display: flex; flex-direction: row; gap: 20px; }
    .BuilderPill { width: 150px; height: 52px; flex-shrink: 0; background-color: #1f150bd9; border-radius: 10px; border: 2px solid #f5e7c866; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 8px; }
    .BuilderIcon { width: 40px; height: 36px; flex-shrink: 0; font-size: 26px; text-align: center; text-shadow: 0px 2px 4px #000000b3; }
    .BuilderText { width: 90px; height: 28px; flex-shrink: 0; font-size: 20px; color: #ffffff; font-weight: bold; text-shadow: 0px 1px 3px #000000b3; }
    .ShieldPill { width: 250px; height: 52px; flex-shrink: 0; background-color: #1f150bd9; border-radius: 10px; border: 2px solid #f5e7c866; display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 8px; }
    .ShieldIcon { width: 40px; height: 36px; flex-shrink: 0; font-size: 26px; text-align: center; text-shadow: 0px 2px 4px #000000b3; }
    .ShieldText { width: 190px; height: 28px; flex-shrink: 0; font-size: 20px; color: #ffffff; font-weight: bold; text-shadow: 0px 1px 3px #000000b3; }

    /* ── 左侧竖排按钮列（对应参考图左侧一列，纯图标） ── */
    .SideCol { width: 92px; height: 516px; position: absolute; left: 12px; top: 96px; display: flex; flex-direction: column; gap: 14px; }
    .SideBtn { width: 88px; height: 88px; flex-shrink: 0; background-color: #3f2d1e; border-radius: 14px; border: 2px solid #ffe9c255; display: flex; align-items: center; justify-content: center; }
    .SideIcon { width: 88px; height: 59px; flex-shrink: 0; font-size: 42px; text-align: center; text-shadow: 0px 2px 4px #000000b3; }

    /* ── 左下角大按钮：进攻（地图） ── */
    .Btn_map { width: 140px; height: 140px; position: absolute; left: 12px; bottom: 20px; background-color: #3f2d1e; border-radius: 16px; border: 3px solid #ffe9c255; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .Label_map { width: 134px; height: 62px; flex-shrink: 0; font-size: 44px; text-align: center; text-shadow: 0px 2px 4px #000000b3; }
    .MapText { width: 134px; height: 31px; flex-shrink: 0; font-size: 22px; color: #ffffff; font-weight: bold; text-align: center; text-shadow: 0px 1px 2px #00000099; margin-top: 2px; }

    /* ── 右侧竖排：建筑 / 任务 / 宝石商店（纯图标，同参考图右侧） ── */
    .RightCol { width: 92px; height: 304px; position: absolute; right: 16px; top: 430px; display: flex; flex-direction: column; gap: 14px; }
    .Btn_build { width: 88px; height: 88px; flex-shrink: 0; background-color: #3f2d1e; border-radius: 14px; border: 2px solid #ffe9c255; display: flex; align-items: center; justify-content: center; }
    .Btn_tasks { width: 88px; height: 88px; flex-shrink: 0; background-color: #3f2d1e; border-radius: 14px; border: 2px solid #ffe9c255; display: flex; align-items: center; justify-content: center; }
    .Btn_gemShop { width: 88px; height: 88px; flex-shrink: 0; background-color: #3f2d1e; border-radius: 14px; border: 2px solid #ffe9c255; display: flex; align-items: center; justify-content: center; }
    .ActionIcon { width: 88px; height: 59px; flex-shrink: 0; font-size: 40px; text-align: center; text-shadow: 0px 2px 4px #000000b3; }

    /* ── 右下角：商店大按钮 + 小夹板装饰 ── */
    .ClipBtn { width: 76px; height: 76px; position: absolute; right: 212px; bottom: 24px; background-color: #ece5d0; border-radius: 12px; border: 2px solid #b8ad93; display: flex; align-items: center; justify-content: center; }
    .ClipIcon { width: 72px; height: 54px; flex-shrink: 0; font-size: 38px; text-align: center; }
    .ShopBtn { width: 180px; height: 132px; position: absolute; right: 18px; bottom: 20px; background-color: #3f2d1e; border-radius: 16px; border: 3px solid #f5c542aa; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .ShopIcon { width: 174px; height: 64px; flex-shrink: 0; font-size: 46px; text-align: center; text-shadow: 0px 2px 4px #000000b3; }
    .ShopLabel { width: 174px; height: 31px; flex-shrink: 0; font-size: 22px; color: #ffffff; font-weight: bold; text-align: center; text-shadow: 0px 1px 2px #00000099; margin-top: 4px; }
  </style>
  <div class="TopBar">
    <div class="PersonalCenter">
      <div class="LevelBadge">
        <text class="LevelNum">7</text>
      </div>
      <div class="PersonalCol">
        <text class="PlayerName">指挥官</text>
        <div class="XpTrack">
          <div class="XpFill"></div>
        </div>
      </div>
    </div>
    <div class="ResCol">
      <div class="ResPill">
        <text class="GoldLabel">100</text>
        <text class="ResIcon">🪙</text>
      </div>
      <div class="ResPill">
        <text class="ElixirLabel">0</text>
        <text class="ResIcon">⚗️</text>
      </div>
      <div class="ResPill">
        <text class="GemLabel">0</text>
        <text class="ResIcon">💎</text>
      </div>
    </div>
    <div class="TopCenterRow">
      <div class="BuilderPill">
        <text class="BuilderIcon">👷</text>
        <text class="BuilderText">0/6</text>
      </div>
      <div class="ShieldPill">
        <text class="ShieldIcon">🛡️</text>
        <text class="ShieldText">6小时29分钟</text>
      </div>
    </div>
    <div class="SideCol">
      <div class="SideBtn"><text class="SideIcon">🏆</text></div>
      <div class="SideBtn"><text class="SideIcon">✉️</text></div>
      <div class="SideBtn"><text class="SideIcon">💬</text></div>
      <div class="SideBtn"><text class="SideIcon">🛡️</text></div>
      <div class="SideBtn"><text class="SideIcon">⚔️</text></div>
    </div>
    <button class="Btn_map">
      <text class="Label_map">🗺️</text>
      <text class="MapText">进攻!</text>
    </button>
    <div class="RightCol">
      <button class="Btn_build"><text class="ActionIcon">🏗️</text></button>
      <button class="Btn_tasks"><text class="ActionIcon">📋</text></button>
      <button class="Btn_gemShop"><text class="ActionIcon">💎</text></button>
    </div>
    <div class="ClipBtn">
      <text class="ClipIcon">📜</text>
    </div>
    <button class="ShopBtn">
      <text class="ShopIcon">🛒</text>
      <text class="ShopLabel">商店</text>
    </button>
  </div>
</widget>
