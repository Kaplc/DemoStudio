name: demostudio
description: "DemoStudio Harness 内置 Profile"

# DSH runtime 启动时加载的 bundles（plugins）
# - 工具由 ds-engine-tools/dist/index.js 提供
# - 工具实现不依赖 DSH 内部 API（架构红线 FR-4.7）
bundles:
  - path: "../ds-plugin/dist/index.js"
    apply: "@demostudio/ds-engine-tools"

# Cordis plugins
plugins:
  - name: "demostudio-engine-context"
    description: "注入 EngineBridge + FileBridge 到 Cordis ctx"
    setup: |
      ctx.engineBridge = (globalThis).__dshEngineCtx?.engineBridge;
      ctx.fileBridge = (globalThis).__dshEngineCtx?.fileBridge;
      ctx.guardPolicy = (globalThis).__dshEngineCtx?.guardPolicy ?? {};

# 默认 model（覆盖于 user settings）
provider: deepseek-official
model: deepseek-v4-flash
